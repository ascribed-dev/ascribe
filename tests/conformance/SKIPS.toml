# Skipped conformance cases and tags. See README.md, "Skips".
#
# Every skip is deliberate and has a reason; the runner prints each one. A case
# whose area tag has neither an adapter nor an entry here fails. When an
# adapter is registered for a tag, remove that tag's entry: the runner
# reports a full tag skip for a handled tag as an error.
#
# Entries:
#   tag = "<tag>" or case = "<case id>"   exactly one
#   reason = "<why>"                      required
#   checks = ["outline" | "diagnostics" | "builds", ...]
#                                         optional; skips only these checks

[[skip]]
tag = "output"
reason = "No adapter for tag `output` (plain, site, and JSON outputs): no case carries it, and the emitters have their own tests in tessera-emit."
