# Skipped conformance cases and tags. See README.md, "Skips".
#
# Every skip is deliberate and has a reason; the runner prints each one. A case
# whose area tag has neither an adapter nor an entry here fails. When a phase
# registers an adapter for a tag, it removes that tag's entry: the runner
# reports a full tag skip for a handled tag as an error.
#
# Entries:
#   tag = "<tag>" or case = "<case id>"   exactly one
#   reason = "<why>"                      required
#   checks = ["outline" | "diagnostics" | "builds", ...]
#                                         optional; skips only these checks

[[skip]]
tag = "resolve"
reason = "Adapter for tag `resolve` (resolution passes and build modes) not yet implemented; phase 12."

[[skip]]
tag = "page-check"
reason = "Adapter for tag `page-check` (page-level diagnostics) not yet implemented; phase 14."

[[skip]]
tag = "output"
reason = "Adapter for tag `output` (plain, site, and JSON outputs) not yet implemented; phases 18 and 20."
