# The Tessera diagnostics registry.
#
# One entry for every diagnostic a Tessera processor reports: every row of
# SPEC §8.2, and every loader rule in project-docs/content-model.md §20.
# Crates report problems by slug (tessera-core's `Issue`, whose slug constants
# mirror this file); phase 10 maps each slug to its code, severity, and message
# here; conformance cases name diagnostics by slug.
#
# This file is a contract (project-docs/phases/README.md, "Contracts"). After
# phase 02, entries change only through an approved entry in
# project-docs/questions.md. tests/conformance/tests/registry.rs checks it
# against SPEC.md, content-model.md, and questions.md, and tessera-core's
# tests check its slug constants against it.
#
# Required fields:
#
#   code      "TSR" and three digits, assigned in file order. Codes are never
#             reused or renumbered: a new diagnostic is appended with the next
#             code, and a retired one keeps its entry, with `retired` set.
#   slug      Kebab-case, unique, and stable. Loader rules start with `model-`.
#   severity  "error" or "warning". For a §8.2 row, the row's severity.
#   level     "file" or "page" (SPEC §8.1). File-level diagnostics are checked
#             on each file on its own (with the content model and the file
#             system); a conformance case expects them in its top-level
#             `diagnostics`. Page-level diagnostics are checked on each
#             expanded page, per build; a case expects them under
#             `builds.<name>.diagnostics`.
#   spec      The SPEC.md section the rule comes from.
#   message   The message template. `{name}` is a placeholder, filled from the
#             issue's arguments; `{{` and `}}` are literal braces. A message
#             says what's wrong and, when there's a likely fix, what to do.
#
# Optional fields:
#
#   messages     Named alternative templates, for cases of the rule that need
#                different wording. An issue names the one it uses
#                (`Issue::variant`); otherwise `message` is used.
#   row          The SPEC §8.2 row, as "<construct> | <condition>", copied
#                exactly. Every row has exactly one entry.
#   rule         The content-model.md §20 subsection a loader rule is in.
#   provisional  questions.md entries the entry depends on. A conformance case
#                that expects this diagnostic must be tagged `provisional` and
#                list them in `questions`.
#   retired      Why the diagnostic is no longer reported. Its code and slug
#                stay reserved.

