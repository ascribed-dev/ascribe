# The Ascribe diagnostics registry.
#
# One entry for every diagnostic an Ascribe processor reports: every row of
# SPEC §8.2, and every rule for loading ascribe.toml. Crates report problems
# by slug (ascribe-core's `Issue`, whose slug constants mirror this file); the
# checks map each slug to its code, severity, and message here; conformance
# cases name diagnostics by slug.
#
# tests/conformance/tests/registry.rs checks this file against SPEC.md's
# §8.2 table and the SPEC sections it cites, and ascribe-core's tests check
# its slug constants against it.
#
# Required fields:
#
#   code      "ASC" and three digits, assigned in file order. Codes are never
#             reused or renumbered: a new diagnostic is appended with the next
#             code, and a retired one keeps its entry, with `retired` set.
#   slug      Kebab-case, unique, and stable. Loader rules start with `model-`.
#   severity  "error", "warning", or "advice". For a §8.2 row, the row's
#             severity. Advice is below a warning: shown, and never failing
#             `ascribe check`.
#   level     "file" or "page" (SPEC §8.1). File-level diagnostics are checked
#             on each file on its own (with the content model and the file
#             system); a conformance case expects them in its top-level
#             `diagnostics`. Page-level diagnostics are checked on each
#             expanded page, per build; a case expects them under
#             `builds.<name>.diagnostics`.
#   spec      The SPEC.md section the rule comes from.
#   next      The kind of next step (docs/content/reference/diagnostics.md):
#             "fix" when every instance has a fix Ascribe can apply, as a
#             diagnostic's fix or the editor's quick fix; "choose" when the
#             author picks among things Ascribe can list (a link's target, a
#             key's allowed values); "write" when it needs writing or
#             judgment; "outside" when nothing in the source can fix it;
#             "review" when it may be fine as it is. A retired entry has
#             neither `next` nor `evidence`.
#   evidence  The named pieces of context an agent prompt about it carries,
#             beyond the message and the line; may be empty. The names
#             (`ascribe_check::prompt::EVIDENCE`): "allowed-values", the
#             values the content model allows, from the `values` placeholder;
#             "mentions", the pages that mention a page's title or share its
#             folder; "image-size", an image's size and dimensions; and
#             "descriptions", the descriptions of the pages a diagnostic
#             names.
#   message   The message template. `{name}` is a placeholder, filled from the
#             issue's arguments; `{{` and `}}` are literal braces. A message
#             says what's wrong and, when there's a likely fix, what to do.
#
# Optional fields:
#
#   configurable  `true` when a project may set the check's level in
#                 `[checks]`; `false` when absent. A diagnostic about whether
#                 the project is valid is never configurable, and every
#                 "review" entry is.
#   messages     Named alternative templates, for cases of the rule that need
#                different wording. An issue names the one it uses
#                (`Issue::variant`); otherwise `message` is used.
#   row          The SPEC §8.2 row, as "<construct> | <condition>", copied
#                exactly. Every row has exactly one entry.
#   area         For a quality check, which is neither a SPEC §8.2 row nor a
#                loader rule: what it checks, one of `AREAS` in
#                tests/conformance/src/registry.rs (pages, project, prose,
#                outputs). Only a configurable entry has one; its `severity`
#                is its default level, and its `spec` is the SPEC section of
#                the construct it checks. The diagnostics reference lists it
#                under "Content checks", in its area's section.
#   when         For a quality check: when it's reported, as a sentence
#                without its full stop.
#   group        The group of docs/content/reference/diagnostics.md a loader rule is listed in:
#                file, project, sources, content-types, names, phrases, widgets, or
#                consumer. Every loader rule has one.
#   retired      Why the diagnostic is no longer reported. Its code and slug
#                stay reserved.
#   fix          How to fix the problem, for docs/content/reference/diagnostics.md, which is
#                generated from this file. Every entry that isn't retired has one.
#   example      A short wrong-and-right example, which `ascribe explain` shows:
#                `example.wrong` is a page, `page.md`, with the problem, and
#                `example.right` the same page fixed. Both are checked under the
#                content model in tests/conformance/explain-model.toml, with
#                `example.model` (a fragment of a content model) laid over it, and
#                with the files `example.files` maps by content path beside them.
#                The wrong page must report this diagnostic and nothing else; the
#                right page, nothing (crates/ascribe-query/tests/explain_examples.rs).

###############################################################################
# SPEC §8.2, in table order.
###############################################################################

[[diagnostic]]
code = "ASC001"
slug = "attribute-unknown-key"
severity = "error"
level = "file"
next = "choose"
evidence = []
spec = "3.3"
row = "Attributes | Unknown key for the directive, image, or table row"
message = "`@{name}` has no attribute `{key}`; its attributes are: {keys}"
messages.suggestion = "`@{name}` has no attribute `{key}`; did you mean `{suggestion}`?"
messages.none = "`@{name}` takes no attributes, so `{key}` isn't allowed"
messages.image = "images have no attribute `{key}`; the accepted attributes are: {keys}"
messages.image-none = "images take no attributes in this project; declare `{key}` in [images.attributes] to allow it"
messages.row = "table rows have no attribute `{key}`; a row's only attribute is `available`"
fix = "Fix the key's spelling, or remove it. To accept a new image attribute, declare it in `[images.attributes]`; for a project widget, in its `attributes`."
example.wrong = '''
---
title: Install Quill
---

@note {kind=tip}: Run the installer as an administrator.
'''
example.right = '''
---
title: Install Quill
---

@note {type=tip}: Run the installer as an administrator.
'''

[[diagnostic]]
code = "ASC002"
slug = "attribute-type-mismatch"
severity = "error"
level = "file"
next = "choose"
evidence = ["allowed-values"]
spec = "3.3"
row = "Attributes | Value doesn't match the key's declared type"
message = "`{key}` must be {expected}, but it's \"{value}\""
messages.enum = "`{key}` can't be \"{value}\"; use one of: {values}"
messages.boolean = "`{key}` must be true or false, but it's \"{value}\""
messages.set = "`{key}` takes a single value, so it can't be a value set"
fix = "Give a value of the key's declared type: one of the enumeration's values, `true` or `false` for a boolean, or a plain number such as `600` for a number."
example.wrong = '''
---
title: Install Quill
---

@note {type=hint}: Run the installer as an administrator.
'''
example.right = '''
---
title: Install Quill
---

@note {type=tip}: Run the installer as an administrator.
'''

