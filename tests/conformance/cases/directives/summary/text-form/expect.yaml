    text: ASC149 `page-size`
  - directive: id
    attributes: {permalink: "true"}
    primary: ASC149
    binding: heading
  - directive: summary
    primary: A page's Markdown is as long as the limit or longer.
    binding: heading
  - paragraph: Error · page level.
