description: >-
  `planned` needs its target to have exactly one planned line: with none,
  or with two, it's an error at the word. On a versionless target or a
  dimension name it's a version where none is allowed, as any version is.
spec: ["4.4", "8.2"]
tags: [check]

diagnostics:
  - {slug: available-planned-line, file: index.md, line: 5, column: 26}
  - {slug: available-planned-line, file: index.md, line: 8, column: 26}
  - {slug: available-versionless, file: index.md, line: 11, column: 19}
  - {slug: available-versionless, file: index.md, line: 14, column: 24}
