description: >-
  Explicit ids do not take part in slug numbering, so a heading whose slug
  equals another heading's `@id` duplicates it (Q7); the second heading also
  repeats the first's text.
spec: ["4.1", "5.5", "8.2"]
tags: [page-check, slug, provisional]
questions: [Q19]

builds:
  site:
    diagnostics:
      - {slug: id-duplicate, file: index.md, line: 8}
      - {slug: heading-duplicate-without-id, file: index.md, line: 8}
