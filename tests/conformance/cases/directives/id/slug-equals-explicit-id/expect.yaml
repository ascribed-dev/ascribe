description: >-
  Explicit ids do not take part in slug numbering, so a heading whose slug
  equals another heading's `@id` duplicates it (Q7). That's the only
  problem: with the first heading's id explicit, nothing is numbered, so
  `heading-duplicate-without-id` doesn't apply (Q103).
spec: ["4.1", "5.5", "8.2"]
tags: [page-check, slug]

builds:
  site:
    diagnostics:
      - {slug: id-duplicate, file: index.md, line: 8}
