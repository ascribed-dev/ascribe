description: >-
  An `@id` names the section for `@include`; the include omits the heading
  when `heading=false`, and keeps the section's directives.
spec: ["4.1", "4.2", "9.2"]
tags: [resolve, include, provisional]
questions: [Q25]

builds:
  site:
    pages:
      index.md:
        outline:
          - heading: 1
            text: Page
          - directive: id
            primary: custom-id
            binding: heading
          - paragraph: Body text.
