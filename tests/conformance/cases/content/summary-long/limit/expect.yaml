description: >-
  `[checks.summary-long] limit` sets the length a summary is reported at,
  here 40 characters. A summary is measured as plain text on one line, so
  emphasis and a code span's backticks don't count: the second summary is
  32 characters.
spec: ["4.12"]
tags: [check, page-check]

diagnostics: []
builds:
  site:
    diagnostics:
      - {slug: summary-long, line: 6}
