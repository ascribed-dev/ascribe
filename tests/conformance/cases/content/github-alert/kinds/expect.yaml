description: >-
  A block quote whose first line is one of GitHub's five alert markers is
  reported at the marker, a warning.
spec: ["4.5"]
tags: [check]

diagnostics:
  - {slug: github-alert, line: 5, column: 3, severity: warning}
  - {slug: github-alert, line: 8, column: 3}
  - {slug: github-alert, line: 11, column: 3}
  - {slug: github-alert, line: 14, column: 3}
  - {slug: github-alert, line: 17, column: 3}
