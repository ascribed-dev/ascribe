spec = "0.1"

[project]
content-root = "files"

[types.page.frontmatter]
title = { type = "string", phrases = true }

[dimensions.deployment]
values = ["cloud", "self-managed"]
versionless = ["cloud", "self-managed"]

[features.sso]
name = "Single sign-on"
available = "cloud"

[features.audit]
name = "Audit log"
available = "self-managed"

[phrases]
product = "Quill"
in-title = "Quill"
unused = "Nothing uses this"

[glossary]
pages = ["glossary.md"]

# This case isn't about how its pages open.
[checks]
page-opening-missing = "off"
