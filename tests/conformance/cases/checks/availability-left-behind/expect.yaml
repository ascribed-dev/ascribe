description: >-
  With `[releases]`, a feature whose availability names a version for every
  target, none later than its target's current line, is reported at its key,
  whether its spec is a version or a history. A feature with a later
  version, such as one in a planned line, or a target with no version, isn't;
  nor is one acknowledged in `[[intended]]`.
spec: ["4.4", "4.9"]
tags: [check]

diagnostics:
  - {slug: availability-left-behind, file: ascribe.toml, line: 17}
  - {slug: availability-left-behind, file: ascribe.toml, line: 21}
