description: >-
  Each memo file is placed: on a page, on a section, on a content model
  entry, and on the block its quote is in. A quote is matched with
  whitespace runs read as one space, in the first of two blocks that hold
  it, and in a fragment, where the heading is named. A subfolder means
  nothing, and nothing in a memo's body is checked.
