description: >-
  `planned` in a spec's version place means its target's planned line: it
  filters as that line's version does, alone, after a state, for each of
  two targets with planned lines of their own, and in a history, and a
  retained annotation shows the line's version in its place.
spec: ["4.4", "9.2", "9.3"]
tags: [resolve]

