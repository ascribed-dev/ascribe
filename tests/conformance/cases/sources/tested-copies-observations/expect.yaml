description: >-
  A source in another repository whose copies hold two observations,
  `default` and `node-22`: every file in `examples.observations/` is read,
  so an example both list as it is gets the tested line merged from both,
  and one only `node-22` lists as it is now is current by it alone, not
  stale by `default`. `node-22` also lists a file that wasn't copied, which
  says nothing: `observation-file-missing` is about a folder in the same
  repository.
spec: ["4.8", "7.3", "7.4"]
tags: [check, resolve]

diagnostics: []

builds:
  site:
    pages:
      index.md:
        outline:
          - paragraph: "An example both copied observations list as it is:"
          - code: "console.log(\"hello\");\n"
            info: ts tested="Node 22.4.0 and 24.9.0 on Linux"
          - paragraph: "One that changed after the default run, and that `node-22` ran again:"
          - code: "console.log(\"edited\");\n"
            info: ts tested="Node 22.4.0 on Linux"
