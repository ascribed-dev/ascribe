description: >-
  A moved permalink's page is written as a link from the content root, and
  must be a page, and a heading on it when it names one. A missing page, a
  fragment, and a missing heading are each an error at the entry.
spec: ["7.6", "8.2"]
tags: [check]

diagnostics:
  - {slug: permalink-retired-target-missing, file: ascribe.addresses, line: 4}
  - {slug: permalink-retired-target-missing, file: ascribe.addresses, line: 6}
  - {slug: permalink-retired-target-missing, file: ascribe.addresses, line: 7}
