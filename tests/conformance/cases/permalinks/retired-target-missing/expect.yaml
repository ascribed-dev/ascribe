description: >-
  A retired permalink's `to` is written as a link from the content root, and
  must lead to a page, and to a heading on it when it names one. A missing
  page, a fragment, and a missing heading are each an error at the `to`.
spec: ["7.6", "8.2"]
tags: [check]

diagnostics:
  - {slug: permalink-retired-target-missing, file: ascribe.toml, line: 9}
  - {slug: permalink-retired-target-missing, file: ascribe.toml, line: 10}
  - {slug: permalink-retired-target-missing, file: ascribe.toml, line: 11}
