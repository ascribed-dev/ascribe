description: >-
  For a heading with `@id` both ids are the `@id`: a link by id works even
  when an included fragment repeats the heading text. The fragment's heading
  has no `@id` but its slug (`setup`) collides with no other heading's slug,
  since the page's heading has an explicit id, so nothing is numbered and
  nothing is reported (Q103).
spec: ["4.1", "5.5"]
tags: [page-check, slug]

builds:
  site:
    diagnostics: []
