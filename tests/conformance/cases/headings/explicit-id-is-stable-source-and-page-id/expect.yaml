description: >-
  For a heading with `@id` both ids are the `@id`: a link by id works even
  when an included fragment repeats the heading text. The fragment's heading
  has no `@id` and repeats the page's, and it's the later of the two, so it's
  reported once, at the include site (Q20).
spec: ["4.1", "5.5"]
tags: [page-check, slug]

builds:
  site:
    diagnostics:
      - {slug: heading-duplicate-without-id, file: index.md, line: 8}
