  Appendix B page: no diagnostics at file or page level, and the same three
  pages and two assets under every build. The streaming-sync section drops
  out of the self-managed 3.3 build, and the deployment group reduces to its
  cloud arm in the cloud build. A test keeps this case identical to
  examples/quill.
