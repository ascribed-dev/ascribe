description: >-
  A top section whose own page is beside its folder isn't placed by that
  page among the content root's pages: it's ordered among the top sections,
  so the file leaving it out where it lists a sibling is advice, on its own
  page.
spec: ["7.8"]
tags: [check]

diagnostics:
