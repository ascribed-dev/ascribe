description: >-
  A marker that names a body its operation doesn't have is an error at the
  marker: a request body it doesn't take, a response with no status, a status
  it has no response for or whose response has no body, a media type it
  doesn't have, no JSON media type, or more than one when the marker names
  none. A marker whose link isn't to an operation names no body. One whose
  operation the spec doesn't have is the link's error alone.
spec: ["7.11", "8.2"]
tags: [check]

