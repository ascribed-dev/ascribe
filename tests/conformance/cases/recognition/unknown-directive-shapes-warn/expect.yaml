description: >-
  A line shaped like a directive (`@word` then `{`, `:`, or the end of the
  line) with an unknown name is text, but draws a warning that suggests the
  closest directive.
spec: ["3.2", "8.2"]
tags: [check]

diagnostics:
  - {slug: directive-unknown, line: 5}
  - {slug: directive-unknown, line: 7}
  - {slug: directive-unknown, line: 9}
