[package]
name = "ascribe-corpora"
description = "Real-documentation corpora and performance checks for Ascribe: fetching, recognition, conversion, and benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
ascribe-check.workspace = true
ascribe-core.workspace = true
ascribe-emit.workspace = true
ascribe-model.workspace = true
ascribe-resolve.workspace = true
ascribe-synthetic.workspace = true
ascribe-syntax.workspace = true
