[dev-dependencies]
tempfile = "3"

# A plain `main` timing the commands, not a benchmark framework (as in
# ascribe-resolve and ascribe-lsp): nothing here needs more statistics than the median and the
# 95th percentile.
[[bench]]
name = "perf"
harness = false

