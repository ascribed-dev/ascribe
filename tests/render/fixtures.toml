# The site-render fixtures. See README.md.
#
# Each fixture is a directory here with input.md (site markdown) and
# expected.html. `covers` names the constructs the fixture checks.
# tests/conformance/tests/render_fixtures.rs checks that every fixture is
# listed here, with a description, and has both files.

[[fixture]]
name = "heading-id"
covers = ["heading"]
description = "A marker at the end of an ATX heading gives the heading its id."

[[fixture]]
name = "heading-id-duplicate-numbering"
covers = ["heading", "heading-duplicates"]
description = "Headings with the same text keep the numbered ids the emitter gave them."

[[fixture]]
name = "heading-id-inline-markup"
covers = ["heading-markup"]
description = "The marker follows code, emphasis, and a link, which render as usual."

[[fixture]]
name = "heading-id-protected-text"
covers = ["heading-protected"]
description = "Ids containing __, --, and ... come through exactly, whatever inline parsing or typography would do to text."

[[fixture]]
name = "heading-id-forms"
covers = ["heading-setext", "heading-empty", "heading-closed"]
description = "Setext headings, a heading whose only content is a marker, and an ATX closing sequence."

[[fixture]]
name = "image-inline"
covers = ["image-inline", "image-title"]
description = "Inline images followed by markers, one with a title."

[[fixture]]
name = "image-reference"
covers = ["image-reference-full", "image-reference-collapsed", "image-reference-shortcut", "image-title"]
description = "Full, collapsed, and shortcut reference images followed by markers."

[[fixture]]
name = "image-in-text"
covers = ["image-in-text", "image-in-link"]
description = "Two images in a paragraph with text around them, and an image inside a link."

[[fixture]]
name = "attribute-values"
covers = ["attribute-values", "heading"]
description = "Escaped quotes, ampersands, and angle brackets in marker values decode; spaces and commas stay."

[[fixture]]
name = "not-markers"
covers = ["not-a-marker"]
description = "Markers after a space, mid-heading, or in a paragraph, and malformed markers, stay as raw HTML."

[[fixture]]
name = "elements-passthrough"
covers = ["raw-html"]
description = "Custom elements and <details> wrapping markdown pass through, and markers inside them apply."

[[fixture]]
name = "image-ends-heading"
covers = ["image-ends-heading", "image-inline", "heading"]
description = "A marker directly after an image applies to the image, even when the image ends the heading; the emitter's heading marker follows a space."

[[fixture]]
name = "anchors-blocks"
covers = ["anchor-markdown-blocks", "anchor-list-items", "anchor-tight-list", "anchor-raw-html"]
description = "Every block the markdown pipeline renders carries its anchor: headings, paragraphs, code, lists and their items, a table, a quote, an image, a break, and raw HTML. A tight list's text has no paragraph to carry one."

[[fixture]]
name = "anchors-elements"
covers = ["anchor-elements"]
description = "Every element the emitter writes carries its anchor on its own tag: notes, steps, details, availability, widgets, a widget group, and tabs."

[[fixture]]
name = "anchors-nesting"
covers = ["anchor-nesting", "anchor-list-items"]
description = "A paragraph in a list item in steps in a variant arm, and a list in a quote in another arm, each with its own anchor."

[[fixture]]
name = "anchors-fragment"
covers = ["anchor-via"]
description = "Blocks from a fragment, and from a fragment it includes, carry the includes they came through."
