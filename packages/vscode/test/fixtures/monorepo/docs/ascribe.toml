# A project at docs/, from examples/quill's content model.
spec = "0.1"

[project]
content-root = "docs"
output-dir = ".ascribe/build"

[types.page]
default = true

[types.page.frontmatter]
title = "string"
description = "string?"

[dimensions.deployment]
label = "Deployment"
values = ["cloud", "self-managed"]
versionless = ["cloud"]
labels = { cloud = "Quill Cloud" }

[phrases]
product = "Quill"

[builds.site]
variants = "switch"
availability = "badge"

[builds.cloud]
variants = { deployment = "cloud" }
availability = { filter = "cloud" }

[editor]
build = "site"

# The tests write pages that nothing links to.
[checks]
page-orphan = "off"
