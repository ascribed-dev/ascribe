# The whole pipeline for a docs project that publishes with Astro: the recipe
# in docs/content/checks/ci.md ("Everything in one workflow"), which takes it
# from this file, and the `preview` job docs/content/review/ci-report.md shows.
# Every job runs the `ascribe` this project's package.json pins, with `npm ci`
# and `npx`, so a new release changes CI only when the pin moves. GitHub runs a
# workflow only from the repository's root, so this file is the recipe, not
# this example's CI: scripts/sources-fixture/setup.test.ts holds it to the
# steps the page names.
# :snippet-start: workflow
name: Docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the check can read ascribe.addresses at the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: npx ascribe check --deny-warnings --format github --base origin/$GITHUB_BASE_REF
      - if: github.event_name == 'push' && !github.event.created
        run: npx ascribe check --deny-warnings --format github --base ${{ github.event.before }} --base-exact
      - if: github.event_name == 'push' && github.event.created
        run: npx ascribe check --deny-warnings --format github
      - run: npx ascribe fmt --check --format github
      # The agents' instructions, once `ascribe agents sync` has written them.
      - run: npx ascribe agents sync --check
      # Only with tested examples: in the folder with ascribe.examples.toml.
      - run: npx ascribe observe --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      # The site, as the host will build it, in dist/.
      - run: npx astro build

  # :snippet-start: preview
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The whole history, so `ascribe diff` finds where the branch left its
      # base. The default, one commit, isn't enough.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Write the preview
        run: npx ascribe diff --base "origin/$GITHUB_BASE_REF" --format html > review.html
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review.html
          path: review.html
          # One file, not zipped, so it opens in the browser.
          archive: false
      - name: Link the preview from the summary
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### HTML preview"
            echo
            npx ascribe diff --base "origin/$GITHUB_BASE_REF" | sed 's/^/    /'
            echo
            echo "[Open the HTML preview]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"
  # :snippet-end: preview
# :snippet-end: workflow
