# The content model for the Astro end-to-end example: a small project that
# covers the integrations most likely to break.
# :snippet-start: site
spec = "0.1"

[project]
content-root = "content"
output-dir = ".ascribe/build"

# Must agree with `astro.config.mjs`: `@ascribed/astro` checks that it does.
[consumer]
profile = "astro"
site = "https://docs.example.com"
base-path = "/docs/"
trailing-slash = "never"
# :snippet-end:
# :snippet-start: agents
# llms.txt, a Markdown version of each page, and a pointer to the index on
# each: what agents read. `@ascribed/astro` publishes them with the site.
agents = true
# :snippet-end:

[types.page]
default = true

# `inline = "code"`: a title can show code, as "`loom.yaml` options".
[types.page.frontmatter]
title = { type = "string", inline = "code" }
description = { type = "string?", role = "description" }

# `@variant {pm=npm}:` and friends: a group the site keeps as tabs.
[dimensions.pm]
label = "Package manager"
values = ["npm", "pnpm", "yarn"]

# `@variant {deployment=cloud}:`, and `available: cloud, self-managed preview 3.4`.
[dimensions.deployment]
label = "Deployment"
values = ["cloud", "self-managed"]
versionless = ["cloud"]
labels = { cloud = "Loom Cloud", "self-managed" = "Self-managed" }

[phrases]
product = "Loom"

# `![alt](src){width=300}`.
[images.attributes]
width = "number?"

# The site: the deployment group reduces to its cloud arm, and the package
# manager group stays a switcher.
[builds.site]
variants = { deployment = "cloud" }
availability = "badge"

[editor]
build = "site"
