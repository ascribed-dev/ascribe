# The docs' own check, on every pull request: the update pull request's too,
# so one whose examples broke fails here. It installs `@ascribed/cli@next`, so
# it follows `main`, where the recipe in docs/content/checks/ci.md runs the
# version a project pins (examples/getting-started/.github/workflows/check.yml).
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global @ascribed/cli@next
      # Fails on errors and warnings, then on a page `ascribe fmt` would change,
      # and shows each on the pull request's lines.
      - run: ascribe check --deny-warnings --format github
      - run: ascribe fmt --check --format github
