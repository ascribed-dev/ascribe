# The docs' own check, on every pull request: the update pull request's too,
# so one whose examples broke fails here. It's the recipe in
# docs/content/checks/ci.md ("Add the workflow"), which takes it from this
# file: the line marked `:remove:` is what this example adds, since it follows
# `main`.
# :snippet-start: workflow
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global @ascribed/cli
      - run: npm install --global @ascribed/cli@next # :remove:
      # Fails on errors and warnings, then on a page `ascribe fmt` would change,
      # and shows each on the pull request's lines.
      - run: ascribe check --deny-warnings --format github
      - run: ascribe fmt --check --format github
# :snippet-end:
