<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ascribe Review Mockup</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <style>
      /* Layout: a short brief above one fake editor window: activity bar, source editor, preview. */
      :root {
        --page: #eceef2;
        --ink: #1d2330;
        --muted: #5b6475;
        --win: #ffffff;
        --chrome: #e4e7ec;
        --side: #f3f4f7;
        --line: #d3d8e0;
        --accent: #1f6feb;
        --accent-ink: #ffffff;
        --add: #1a7f37;
        --add-bg: #dcf7e3;
        --chg: #8a5a00;
        --chg-bg: #fff1c2;
        --del: #c4222d;
        --del-bg: #ffe4e2;
        --mov: #7a3fd0;
        --mov-bg: #f0e6ff;
        --thread: #f5f7fb;
        --hl: #fff6bf;
        --code-bg: #f0f2f6;
        --status: #1c4a86;
        --status-ink: #ffffff;
        --brand: #a94a08;
        --brand-bg: #fff3e6;
        --syn-dir: #7a3fd0;
        --syn-head: #0b56c2;
        --syn-attr: #0a6b62;
        --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --site: "Figtree", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #121418;
          --ink: #d9dde5;
          --muted: #929bab;
          --win: #1e2026;
          --chrome: #16181d;
          --side: #23262d;
          --line: #343a45;
          --accent: #5aa2ff;
          --accent-ink: #0b1220;
          --add: #4fc572;
          --add-bg: #133520;
          --chg: #dcb13a;
          --chg-bg: #3a2f0d;
          --del: #ff8279;
          --del-bg: #401918;
          --mov: #c59bff;
          --mov-bg: #2d2440;
          --thread: #272b33;
          --hl: #3b3514;
          --code-bg: #282c35;
          --status: #1b3a66;
          --status-ink: #e8eefc;
          --brand: #f2a65a;
          --brand-bg: #33251a;
          --syn-dir: #c59bff;
          --syn-head: #79b4ff;
          --syn-attr: #5fd0c2;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --page: #121418;
        --ink: #d9dde5;
        --muted: #929bab;
        --win: #1e2026;
        --chrome: #16181d;
        --side: #23262d;
        --line: #343a45;
        --accent: #5aa2ff;
        --accent-ink: #0b1220;
        --add: #4fc572;
        --add-bg: #133520;
        --chg: #dcb13a;
        --chg-bg: #3a2f0d;
        --del: #ff8279;
        --del-bg: #401918;
        --mov: #c59bff;
        --mov-bg: #2d2440;
        --thread: #272b33;
        --hl: #3b3514;
        --code-bg: #282c35;
        --status: #1b3a66;
        --status-ink: #e8eefc;
        --brand: #f2a65a;
        --brand-bg: #33251a;
        --syn-dir: #c59bff;
        --syn-head: #79b4ff;
        --syn-attr: #5fd0c2;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      body {
        background: var(--page);
        color: var(--ink);
        font-family: var(--ui);
        font-size: 14px;
        line-height: 1.5;
      }
      .wrap {
        max-width: 1360px;
        margin: 0 auto;
        padding-inline: 16px;
        padding-block: 20px 28px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .blk:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      code {
        font-family: var(--mono);
        font-size: 0.9em;
        background: var(--code-bg);
        padding: 0.05em 0.35em;
        border-radius: 3px;
      }

      /* Brief */
      .brief {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .brief h1 {
        font-family: var(--site);
        font-size: 20px;
        font-weight: 700;
        margin: 0;
      }
      .brief p {
        margin: 0;
        color: var(--muted);
        max-width: 72ch;
      }
      .brief .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: center;
      }
      .brief .lbl {
        font-size: 11px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
        margin-right: 2px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--win);
        border-radius: 999px;
        padding: 3px 11px;
        font-size: 12.5px;
      }
      .chip:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .brief select {
        border: 1px solid var(--line);
        background: var(--win);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 12.5px;
        max-width: 100%;
      }

      /* Window */
      .window {
        background: var(--win);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 780px;
        position: relative;
      }
      .titlebar {
        background: var(--chrome);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .dots {
        display: flex;
        gap: 6px;
      }
      .dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line);
        display: block;
      }
      .titlebar .name {
        flex: 1;
        text-align: center;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .titlebar .paneswitch {
        display: none;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 5px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        background: transparent;
        padding: 2px 9px;
        font-size: 12px;
        color: var(--muted);
      }
      .seg button + button {
        border-left: 1px solid var(--line);
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
      }

      .main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1.6fr);
      }
      .activity {
        background: var(--chrome);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding-top: 8px;
      }
      .activity span {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 5px;
        color: var(--muted);
        font-size: 15px;
      }
      .activity span.on {
        color: var(--ink);
        box-shadow: inset 2px 0 0 var(--accent);
        background: var(--side);
      }

      .pane {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .pane + .pane {
        border-left: 1px solid var(--line);
      }
      .tabs {
        background: var(--chrome);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: stretch;
        gap: 8px;
        font-size: 12.5px;
        min-height: 33px;
      }
      .tab {
        background: var(--win);
        padding: 6px 12px;
        border-right: 1px solid var(--line);
        box-shadow: inset 0 2px 0 var(--accent);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .tabs .sp {
        flex: 1;
      }
      .tabs .act {
        align-self: center;
        margin-right: 8px;
        display: flex;
        gap: 6px;
        flex: none;
      }
      .ghost {
        border: 1px solid var(--line);
        background: var(--win);
        border-radius: 5px;
        padding: 2px 8px;
        font-size: 12px;
      }
      .ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .primary {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        border-radius: 5px;
        padding: 2px 10px;
        font-size: 12.5px;
        font-weight: 600;
      }
      .linkbtn {
        border: 0;
        background: transparent;
        color: var(--accent);
        padding: 0;
        font-size: inherit;
      }
      .linkbtn:hover {
        text-decoration: underline;
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      /* Source */
      .src {
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.65;
        padding: 8px 0 24px;
      }
      .ln {
        display: grid;
        grid-template-columns: 38px 4px 22px minmax(0, 1fr);
        align-items: start;
      }
      .ln .n {
        text-align: right;
        color: var(--muted);
        padding-right: 8px;
        user-select: none;
        font-size: 11.5px;
        line-height: 1.8;
      }
      .ln .bar {
        align-self: stretch;
      }
      .ln.add .bar {
        background: var(--add);
      }
      .ln.chg .bar {
        background: var(--chg);
      }
      .ln .plus {
        border: 0;
        background: transparent;
        color: var(--accent);
        padding: 0;
        opacity: 0;
        font-weight: 700;
        line-height: 1.65;
      }
      .ln:hover .plus,
      .ln .plus:focus-visible {
        opacity: 1;
      }
      .ln .plus.has {
        opacity: 1;
        color: var(--muted);
      }
      .ln .tx {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding-right: 12px;
        cursor: default;
      }
      .ln.hl {
        background: var(--hl);
      }
      .s-dir {
        color: var(--syn-dir);
        font-weight: 600;
      }
      .s-attr {
        color: var(--syn-attr);
      }
      .s-hd {
        color: var(--syn-head);
        font-weight: 600;
      }
      .s-meta {
        color: var(--muted);
      }
      .src .inline {
        margin: 4px 12px 8px 64px;
        font-family: var(--ui);
        font-size: 13px;
        line-height: 1.5;
      }
      .strip {
        font-size: 12px;
        color: var(--muted);
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--side);
      }

      /* Review controls: the editor's header in the page preview, the toolbar app's panel in the site preview */
      .rhead {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--side);
        font-size: 12px;
      }
      .rhead .grow {
        flex: 1;
        min-width: 160px;
        color: var(--muted);
      }
      .rhead b {
        color: var(--ink);
        font-weight: 600;
      }
      .legend {
        flex-basis: 100%;
        color: var(--muted);
        font-size: 11.5px;
      }
      .pos {
        font-size: 12px;
        white-space: nowrap;
      }
      .sq {
        min-width: 28px;
        min-height: 24px;
      }
      .notice {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--chg-bg);
        font-size: 12.5px;
      }
      .notice .sp {
        flex: 1;
      }

      /* The page */
      .doc {
        padding: 18px 22px 40px;
        max-width: 760px;
        font-size: 14.5px;
        line-height: 1.6;
        min-width: 0;
      }
      .doc h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 10px;
        text-wrap: balance;
      }
      .doc h2 {
        font-size: 18px;
        margin: 22px 0 6px;
      }
      .doc p {
        margin: 8px 0;
      }
      .doc ul,
      .doc ol {
        margin: 8px 0;
        padding-left: 24px;
      }
      .doc li {
        margin: 4px 0;
      }
      .doc pre {
        background: var(--code-bg);
        padding: 10px 12px;
        border-radius: 6px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        margin: 8px 0;
      }
      .doc a {
        color: var(--accent);
      }
      .layout {
        position: relative;
      }
      .layout.wide {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 250px;
        gap: 0 6px;
        padding-right: 12px;
      }
      .tcol {
        position: relative;
        margin-top: 18px;
      }
      .slot {
        position: absolute;
        left: 0;
        right: 0;
      }
      .slot .thread,
      .slot .composer {
        margin: 0 0 6px;
      }
      .slot.linked .thread {
        border-color: var(--accent);
      }
      svg.conn {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
      }
      svg.conn path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.5;
      }

      .blk {
        position: relative;
        border-left: 3px solid transparent;
        padding-left: 9px;
        margin-left: -12px;
        border-radius: 0 3px 3px 0;
      }
      li.blk {
        margin-left: 0;
        padding-left: 6px;
      }
      .blk.linked {
        background: var(--hl);
      }
      .blk:hover > .cbtn,
      .blk.sel > .cbtn,
      .blk:focus-within > .cbtn {
        opacity: 1;
      }
      .cbtn {
        position: absolute;
        right: 0;
        top: 0;
        opacity: 0;
        border: 1px solid var(--line);
        background: var(--win);
        border-radius: 5px;
        font-size: 11.5px;
        padding: 0 7px;
        color: var(--accent);
        text-decoration: none;
      }
      .narrow .blk.has {
        padding-right: 44px;
      }
      .narrow .blk {
        cursor: pointer;
      }
      .marker {
        position: absolute;
        right: 0;
        top: 0;
        border: 1px solid var(--accent);
        background: var(--win);
        color: var(--accent);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        padding: 0 8px;
        min-width: 30px;
        min-height: 24px;
      }
      .blk > .where {
        display: none;
      }
      .blk:hover > .where,
      .blk.sel > .where,
      .blk:focus > .where,
      .blk:focus-within > .where {
        display: block;
        position: absolute;
        right: 0;
        top: -15px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
        background: var(--win);
        padding: 0 4px;
        pointer-events: none;
        white-space: nowrap;
        z-index: 1;
      }
      .flash {
        animation: flash 1.4s ease-out;
      }
      @keyframes flash {
        from {
          background: var(--hl);
        }
        to {
          background: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flash {
          animation: none;
          outline: 2px solid var(--accent);
        }
      }

      .tagc,
      .mvnote,
      .rmbtn {
        display: none;
      }
      .tagc {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-right: 6px;
      }
      .mode-changes .blk.added {
        border-left-color: var(--add);
        background: var(--add-bg);
      }
      .mode-changes .blk.changed {
        border-left-color: var(--chg);
        border-left-style: dashed;
      }
      .mode-changes .blk.moved {
        border-left-color: var(--mov);
        border-left-style: double;
        background: var(--mov-bg);
      }
      .mode-changes .blk.removed {
        border-left-color: var(--del);
        border-left-style: dotted;
        background: var(--del-bg);
        display: flex;
        gap: 6px;
        align-items: baseline;
        margin-block: 8px;
      }
      .mode-changes .blk.removed .rmtext {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-decoration: line-through;
        color: var(--muted);
      }
      .mode-changes .blk.removed.open .rmtext {
        white-space: normal;
      }
      .mode-changes .blk.added > .tagc,
      .mode-changes .blk.changed > .tagc,
      .mode-changes .blk.removed > .tagc,
      .mode-changes .blk.moved > .tagc {
        display: inline-block;
      }
      .mode-changes .mvnote,
      .mode-changes .rmbtn {
        display: inline;
        font-size: 12px;
        white-space: nowrap;
      }
      .blk.changed > .tagc {
        color: var(--chg);
      }
      .blk.added > .tagc {
        color: var(--add);
      }
      .blk.removed > .tagc {
        color: var(--del);
      }
      .blk.moved > .tagc {
        color: var(--mov);
      }
      .mvfrom {
        font-size: 12px;
        color: var(--mov);
        border-left: 3px double var(--mov);
        padding-left: 9px;
        margin: 6px 0 6px -12px;
      }
      ins {
        text-decoration: none;
      }
      del {
        text-decoration: none;
      }
      .mode-changes ins {
        background: var(--add-bg);
        box-shadow: inset 0 -2px 0 var(--add);
      }
      .mode-changes del {
        background: var(--del-bg);
        text-decoration: line-through;
        color: var(--muted);
      }
      .mode-will del,
      .mode-will .blk.removed {
        display: none;
      }
      .mode-was ins,
      .mode-was .blk.added,
      .mode-was .blk.moved {
        display: none;
      }
      .mode-was .blk.removed {
        margin-block: 8px;
      }

      .avail {
        display: inline-flex;
        gap: 6px;
        flex-wrap: wrap;
        font-size: 12px;
      }
      .avail span {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 8px;
      }
      .note {
        border: 1px solid var(--chg);
        border-radius: 6px;
        padding: 6px 12px;
        background: var(--chg-bg);
        margin: 10px 0;
      }
      .note .k {
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .vtabs {
        border: 1px solid var(--line);
        border-radius: 6px;
        margin: 10px 0;
      }
      .vtabs .bar {
        display: flex;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
        background: var(--side);
        border-radius: 6px 6px 0 0;
      }
      .vtabs .bar button {
        border: 0;
        background: transparent;
        padding: 5px 12px;
        font-size: 13px;
        border-bottom: 2px solid transparent;
        color: var(--muted);
      }
      .vtabs .bar button[aria-selected="true"] {
        color: var(--ink);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      .dot {
        font-size: 11px;
        margin-left: 6px;
        font-weight: 600;
      }
      .vtabs .arm {
        padding: 4px 14px 8px 18px;
      }
      .doc details {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 14px 4px 18px;
        margin: 10px 0;
      }
      .doc summary {
        cursor: pointer;
        font-weight: 600;
        margin-left: -6px;
      }

      /* Threads */
      .thread {
        background: var(--thread);
        border: 1px solid var(--line);
        border-radius: 6px;
        margin: 6px 0 10px;
        font-family: var(--ui);
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--ink);
      }
      .thread .th {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 8px;
        align-items: center;
        padding: 5px 9px 2px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .thread .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
        padding: 0 9px 5px;
        border-bottom: 1px solid var(--line);
        font-size: 11.5px;
      }
      .thread.collapsed .acts {
        border-bottom: 0;
      }
      .thread .orig {
        padding: 5px 9px;
        border-bottom: 1px solid var(--line);
        font-size: 11.5px;
        color: var(--muted);
      }
      .thread .orig q {
        color: var(--ink);
      }
      .thread .inside {
        padding: 5px 9px;
        border-bottom: 1px solid var(--line);
        font-size: 11.5px;
        color: var(--muted);
      }
      .badge {
        border-radius: 999px;
        padding: 0 7px;
        font-size: 10.5px;
        font-weight: 600;
        border: 1px solid currentColor;

      .badge.pending {
        color: var(--chg);
      }
      .badge.resolved {
        color: var(--add);
      }
      .badge.out {
        color: var(--muted);
      }
      .badge.conv {
        color: var(--accent);
      }

        color: var(--del);

      .cmt {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 7px;
        padding: 6px 9px;
      }
      .cmt + .cmt {
        border-top: 1px dashed var(--line);
      }
      .av {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        font-size: 9.5px;
        font-weight: 700;
      }
      .av.bot {
        border-radius: 5px;
        background: var(--muted);
      }
      .cmt .who {
        font-weight: 600;
      }
      .cmt .when {
        color: var(--muted);
        font-size: 11px;
        margin-left: 6px;
      }
      .cmt p {
        margin: 1px 0 0;
        overflow-wrap: anywhere;
      }
      .reply {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px 9px 8px;
        border-top: 1px solid var(--line);
      }
      .reply input {
        flex: 1;
        min-width: 80px;
        font: inherit;
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--win);
        color: var(--ink);
      }
      .composer {
        background: var(--thread);
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 8px 10px;
        margin: 6px 0 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-family: var(--ui);
        font-size: 12.5px;
      }
      .composer textarea {
        font: inherit;
        width: 100%;
        min-height: 56px;
        resize: vertical;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--win);
        color: var(--ink);
      }
      .composer .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .hint {
        color: var(--muted);
        font-size: 11.5px;
      }
      .refuse {
        color: var(--del);
        font-size: 12px;
      }
      .detached {
        margin: 12px 22px 0;
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 8px 10px 2px;
        font-size: 12.5px;
        color: var(--muted);
        max-width: 520px;
      }

      .pendbar {
        border-top: 1px solid var(--line);
        background: var(--chg-bg);
        padding: 6px 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        font-size: 12.5px;
      }
      .pendbar .sp {
        flex: 1;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 8;
        display: grid;
        place-items: center;
        padding: 12px;
      }
      .dialog {
        background: var(--win);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        width: min(480px, 100%);
        max-height: 100%;
        overflow: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-family: var(--ui);
        font-size: 13px;
      }
      .dialog h3 {
        margin: 0;
        font-size: 14px;
      }
      .dialog ul {
        margin: 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .dialog fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
      }
      .dialog textarea {
        font: inherit;
        width: 100%;
        min-height: 56px;
        resize: vertical;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--win);
        color: var(--ink);
      }
      .dialog .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-top: 4px;
      }
      .dialog .row .sp {
        flex: 1;
      }
      .dialog .confirm {
        border: 1px solid var(--del);
        background: var(--del-bg);
        border-radius: 6px;
        padding: 8px 10px;
      }
      .tlist {
        list-style: none;
        margin: 0;
        padding: 0 !important;
        gap: 0 !important;
      }
      .tlist li + li {
        border-top: 1px solid var(--line);
      }
      .tlist button {
        display: flex;
        flex-direction: column;
        gap: 1px;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 6px 4px;
      }
      .tlist button:hover,
      .tlist button:focus-visible {
        background: var(--side);
      }
      .tlist .w {
        font-size: 11.5px;
        color: var(--muted);
      }
      .dialog .seg {
        align-self: flex-start;
        flex-wrap: wrap;
      }
      .pendbar .hint {
        font-size: 12px;
      }
      .danger {
        border: 1px solid var(--del);
        background: var(--del);
        color: var(--win);
        border-radius: 5px;
        padding: 2px 10px;
        font-size: 12.5px;
        font-weight: 600;
      }

      /* Narrow: a panel for one block's threads */
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 62%;
        overflow: auto;
        background: var(--win);
        border-top: 2px solid var(--accent);
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.22);
        padding: 8px 12px 10px;
        z-index: 4;
      }
      .sheet .sh {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .sheet .sh .sp {
        flex: 1;
      }

      /* Site preview: the dev server's page, with the toolbar app inside it */
      .urlbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 5px 10px;
        background: var(--chrome);
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .urlbar .u {
        flex: 1;
        min-width: 0;
        background: var(--win);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 12px;
        font-family: var(--mono);
        font-size: 11.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .site {
        font-family: var(--site);
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }
      .site-head {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--brand-bg);
      }
      .site-head .logo {
        font-weight: 700;
        color: var(--brand);
        font-size: 16px;
      }
      .site-head nav {
        display: flex;
        gap: 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .site-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        flex: 1;
      }
      .site-body.nav {
        grid-template-columns: 160px minmax(0, 1fr);
      }
      .site-nav {
        border-right: 1px solid var(--line);
        padding: 14px 12px;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        color: var(--muted);
      }
      .site-nav b {
        color: var(--ink);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-top: 6px;
      }
      .site-nav .cur {
        color: var(--brand);
        font-weight: 600;
      }
      .site .doc {
        font-size: 15.5px;
      }
      .site .doc h1 {
        font-size: 28px;
        font-weight: 700;
      }
      .site .doc h2 {
        font-weight: 600;
      }
      .app {
        position: sticky;
        bottom: 0;
        margin: 0 10px;
        font-family: var(--ui);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding-bottom: 8px;
        z-index: 3;
        pointer-events: none;
      }

        pointer-events: auto;
      }
      .apppanel {
        align-self: stretch;
        background: var(--win);
        border: 1px solid var(--ink);

        max-height: 300px;
        overflow-y: auto;
      }
      .apppanel .ttl {
        display: flex;
        justify-content: space-between;
        padding: 4px 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        background: var(--ink);
        color: var(--win);
      }
      .apppanel .body {
        padding: 8px 10px;
        font-size: 12.5px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .apppanel .rhead:last-child,
      .apppanel .notice:last-child {
        border-bottom: 0;
      }
      .devbar {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--ink);
        color: var(--win);
        border-radius: 999px;
        padding: 3px 14px;
        font-size: 12px;
      }
      .devbar button {
        border: 1px solid var(--win);
        background: transparent;
        color: var(--win);
        border-radius: 999px;
        padding: 0 9px;
        font-weight: 600;
        min-height: 24px;
      }
      .devbar button.on {
        background: var(--win);
        color: var(--ink);
      }
      .apppanel .ttl .linkbtn {
        color: var(--win);
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
      }
      .plain-list {
        margin: 0;
        padding-left: 18px;
      }

      /* Status bar, quick pick, toast */
      .status {
        background: var(--status);
        color: var(--status-ink);
        display: flex;
        flex-wrap: wrap;
        gap: 0 4px;
        font-size: 12px;
        padding: 0 6px;
      }
      .status button,
      .status span {
        border: 0;
        background: transparent;
        color: inherit;
        padding: 2px 8px;
      }
      .status button:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      .status .sp {
        flex: 1;
        padding: 0;
      }
      .qp {
        position: absolute;
        top: 34px;
        left: 50%;
        transform: translateX(-50%);
        width: min(540px, calc(100% - 24px));
        background: var(--win);
        border: 1px solid var(--line);
        border-radius: 7px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
        z-index: 6;
        overflow: hidden;
      }
      .qp .q {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .qp button {
        display: flex;
        flex-wrap: wrap;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 7px 12px;
        gap: 2px 10px;
        align-items: baseline;
      }
      .qp button:hover,
      .qp button:focus-visible {
        background: var(--side);
      }
      .qp .d {
        color: var(--muted);
        font-size: 12px;
        margin-left: auto;
        text-align: right;
      }
      .toast {
        position: absolute;
        right: 14px;
        bottom: 34px;
        background: var(--ink);
        color: var(--win);
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 13px;
        z-index: 7;
        max-width: calc(100% - 28px);
      }

      @media (max-width: 760px) {
        .window {
          height: 700px;
        }
        .main {
          grid-template-columns: minmax(0, 1fr);
        }
        .activity {
          display: none;
        }
        .titlebar .paneswitch {
          display: inline-flex;
        }
        .titlebar .name,
        .dots {
          display: none;
        }
        .titlebar {
          justify-content: space-between;
        }
        .main[data-pane="source"] #previewPane,
        .main[data-pane="preview"] #sourcePane {
          display: none;
        }
        .pane + .pane {
          border-left: 0;
        }
        .doc {
          padding: 14px 14px 32px;
        }
        .detached {
          margin-inline: 14px;
        }
      }

                    h("li", {}, [
                      btn("linkbtn", pg.route, function () {
                        state.scenario = "review";
                        syncScenario();
                        openPage(i);
                      }),
                      " " + pg.counts,
                    ]),
                  );
                });
                b1.appendChild(ul);
                panel.appendChild(b1);
              } else {
                controls().forEach(function (c) {
                  panel.appendChild(c);
                });
                if (s === "noanchors") {
                  var xs = flat(p),
                    ths = [],
                    seen = {};
                  xs.forEach(function (x) {
                    threadsFor(x.b).forEach(function (t) {
                      if (!seen[t.id]) {
                        seen[t.id] = 1;
                        ths.push(t);
                      }
                    });
                  });
                  var chg = xs.filter(function (x) {
                    return x.b.change;
                  });
                  var b2 = h("div", { class: "body" }, [
                    h("b", {
                      text:
                        "This page has " +
                        ths.length +
                        " comments and " +
                        chg.length +
                        " changes, but its blocks carry no source anchors.",
                    }),
                    h("span", {
                      text: "A layout or component is probably dropping the data-ascribe-source attributes, so nothing can be placed on the page. Everything is listed here instead.",
                    }),
                    h("span", { class: "hint", text: "Changes" }),
                  ]);
                  var cl = h("ul", { class: "plain-list" });
                  chg.forEach(function (x) {
                    cl.appendChild(
                      h("li", {}, [
                        x.b.change + " ",
                        x.b.rm
                          ? "text"
                          : btn("linkbtn", key(x.b), function () {
                              openSource(x.b.file, x.b.l1, x.b.l2);
                            }),
                      ]),
                    );
                  });
                  b2.appendChild(cl);
                  b2.appendChild(h("span", { class: "hint", text: "Comments" }));
                  ths.forEach(function (t) {
                    b2.appendChild(threadCard(t, "preview"));
                  });
                  panel.appendChild(b2);
                }
                var pb2 = pendingBar();
                if (pb2) panel.appendChild(pb2);
              }
              app.appendChild(panel);
              scEl.style.scrollPaddingBottom = "150px";
              body.style.paddingBottom = "150px";
            }
            app.appendChild(
              h("div", { class: "devbar", "aria-label": "Astro dev toolbar" }, [
                h("span", { text: "▲ astro" }),
                h("span", { text: "⚙" }),
                btn(
                  state.appOpen ? "on" : "",
                  "Ascribe review" + (pn ? " · " + pn + " unsent" : ""),
                  function () {
                    state.appOpen = !state.appOpen;
                    render();
                  },
                  { "aria-expanded": state.appOpen ? "true" : "false" },
                ),
              ]),
            );
            surface.appendChild(app);
            scEl.appendChild(surface);
            pane.appendChild(scEl);
          }

          if (!state.wide && state.panel && byKey[state.panel] && threadsOn()) {
            var x = byKey[state.panel],
              cards = cardsFor(x, "panel");
            var sheet = h(
              "div",
              { class: "sheet", role: "dialog", "aria-label": "Comments on this block" },
              [
                h("div", { class: "sh" }, [
                  h("b", { text: x.b.rm ? "Removed text" : key(x.b) }),
                  h("span", { class: "sp" }),
                  x.b.rm
                    ? null
                    : btn("ghost", "Source", function () {
                        openSource(x.b.file, x.b.l1, x.b.l2);
                      }),
                  x.b.rm || state.composer
                    ? null
                    : btn("ghost", "Comment", function () {
                        startComment(x.b);
                        render();
                      }),
                  btn("ghost", "Close", function () {
                    state.panel = null;
                    state.composer = null;
                    render();
                  }),
                ]),
              ],
            );
            if (!cards.length)
              sheet.appendChild(h("p", { class: "hint", text: "No comments on this block yet." }));
            cards.forEach(function (c) {
              sheet.appendChild(c);
            });
            pane.appendChild(sheet);
          }
          var dlg = submitDialog() || threadList();
          if (dlg) pane.appendChild(dlg);
          scEl.scrollTop = top;
          changeEls = Array.prototype.slice.call(doc.querySelectorAll(".chg-target"));
          layoutColumn();
        }

        // ---------- Thread column: place each slot beside its block, without overlap ----------
        function anchorEl(lay, k) {
          var el = byAttr(lay, "data-src", k);
          while (el && el.offsetParent === null && el !== lay) el = el.parentElement;
          return el;
        }
        function layoutColumn() {
          var lay = document.querySelector("#previewPane .layout.wide");
          if (!lay) return;
          var col = lay.querySelector(".tcol"),
            base = col.getBoundingClientRect().top,
            prev = 0;
          Array.prototype.forEach.call(col.children, function (slot) {
            var a = anchorEl(lay, slot.getAttribute("data-key"));
            var top = Math.max(a ? a.getBoundingClientRect().top - base : prev, prev);
            slot.style.top = top + "px";
            prev = top + slot.offsetHeight + 2;
          });
          col.style.minHeight = prev + "px";
        }
        function connect(k, on) {
          var lay = document.querySelector("#previewPane .layout.wide");
          if (!lay) return;
          var svg = lay.querySelector("svg.conn");
          svg.textContent = "";
          Array.prototype.forEach.call(lay.querySelectorAll(".linked"), function (o) {
            o.classList.remove("linked");
          });
          if (!on) return;
          var a = anchorEl(lay, k),
            slot = byAttr(lay, "data-key", k);
          if (!a || !slot || a === lay) return;
          a.classList.add("linked");
          slot.classList.add("linked");
          var L = lay.getBoundingClientRect(),
            A = a.getBoundingClientRect(),
            S = slot.getBoundingClientRect();
          var x1 = A.right - L.left,
            y1 = A.top - L.top + 12,
            x2 = S.left - L.left,
            y2 = S.top - L.top + 14,
            mid = (x1 + x2) / 2;
          var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", "M" + x1 + " " + y1 + " H" + mid + " V" + y2 + " H" + x2);
          svg.appendChild(path);
        }

        // ---------- Status bar, quick picks, toast ----------
        function renderStatus() {
          var s = document.getElementById("status"),
            v = sc();
          s.textContent = "";
          s.appendChild(
            h("span", {
              text:
                "⑂ docs/agent-scheduled-rollouts" +
                (v === "behind" ? " ↓2" : v === "ahead" ? " ↑1" : ""),
            }),
          );
          s.appendChild(h("span", { text: "◈ docs · site" }));
          s.appendChild(
            btn("", reviewOn() ? "Review: #128 ← main" : "Review: off", function () {
              state.qp = reviewOn() ? "pages" : "base";
              render();
            }),
          );
          s.appendChild(h("span", { class: "sp" }));
          s.appendChild(
            h("span", { text: v === "nosignin" ? "GitHub: not signed in" : "GitHub: signed in" }),
          );
          var w = document.getElementById("window");
          Array.prototype.forEach.call(w.querySelectorAll(".qp, .toast"), function (e) {
            e.remove();
          });
          if (state.qp === "pages") {
            var qp = h("div", { class: "qp", role: "dialog", "aria-label": "Changed pages" }, [
              h("div", {
                class: "q",
                text: reviewOn()
                  ? "Changed pages in #128 (build: site)"
                  : "Start a review to see changed pages",
              }),
            ]);
            if (reviewOn())
              PAGES.forEach(function (p, i) {
                qp.appendChild(
                  h(
                    "button",
                    {
                      type: "button",
                      onclick: function () {
                        state.qp = null;
                        openPage(i);
                      },
                    },
                    [
                      h("span", { text: p.title }),
                      h("span", {
                        class: "d",
                        text: p.counts + (p.own ? "" : " · via prereqs.md"),
                      }),
                    ],
                  ),
                );
              });
            qp.appendChild(
              reviewOn()
                ? h(
                    "button",
                    {
                      type: "button",
                      onclick: function () {
                        state.qp = null;
                        setScenario("start");
                      },
                    },
                    [h("span", { text: "Ascribe: Stop Review" })],
                  )
                : h(
                    "button",
                    {
                      type: "button",
                      onclick: function () {
                        state.qp = "base";
                        render();
                      },
                    },
                    [h("span", { text: "Ascribe: Start Review" })],
                  ),
            );
            w.appendChild(qp);
          }
          if (state.qp === "base") {
            var qb = h("div", { class: "qp", role: "dialog", "aria-label": "Start review" }, [
              h("div", { class: "q", text: "Review this project's changes against…" }),
            ]);
            [
              ["The base of pull request #128", "main, from merge base 9c1e4d2"],
              ["The default branch", "origin/main, from the merge base"],
              ["A revision you type…", "a branch, tag or commit"],
            ].forEach(function (o) {
              qb.appendChild(
                h(
                  "button",
                  {
                    type: "button",
                    onclick: function () {
                      state.qp = null;
                      setScenario("review");
                      toast("Review started against main. 2 pages changed.");
                    },
                  },
                  [h("span", { text: o[0] }), h("span", { class: "d", text: o[1] })],
                ),
              );
            });
            w.appendChild(qb);
          }
          if (state.toast)
            w.appendChild(h("div", { class: "toast", role: "status", text: state.toast }));
        }

        // ---------- Actions ----------
        function setPane(p) {
          document.getElementById("main").setAttribute("data-pane", p);
          document
            .getElementById("paneSource")
            .setAttribute("aria-pressed", p === "source" ? "true" : "false");
          document
            .getElementById("panePreview")
            .setAttribute("aria-pressed", p === "preview" ? "true" : "false");
        }
        function syncScenario() {
          document.getElementById("scenario").value = state.scenario;
        }
        function setScenario(v) {
          state.scenario = v;
          state.composer = null;
          state.panel = null;
          state.submitOpen = false;
          state.atEnd = false;
          state.appOpen = v !== "review";
          syncScenario();
          if (v === "noanchors" || v === "notpage") {
            state.surface = "site";
            state.page = 0;
            state.file = R;
            setPane("preview");
          }
          render();
        }
        function openPage(i) {
          state.page = i;
          state.file = PAGES[i].path;
          state.composer = null;
          state.panel = null;
          state.hl = null;
          state.changeIdx = -1;
          state.atEnd = false;
          render();
          previewPane().scrollTop = 0;
          document.querySelector("#sourcePane .scroll").scrollTop = 0;
        }
        function openView(surface) {
          var i = -1;
          PAGES.forEach(function (p, n) {
            if (
              i < 0 &&
              (p.path === state.file ||
                flat(p).some(function (x) {
                  return x.b.file === state.file;
                }))
            )
              i = n;
          });
          if (
            PAGES[state.page].path !== state.file &&
            i >= 0 &&
            !flat(page()).some(function (x) {
              return x.b.file === state.file;
            })
          )
            state.page = i;
          state.surface = surface;
          setPane("preview");
          render();
        }
        function openSource(file, l1, l2) {
          state.file = file;
          state.hl = { file: file, l1: l1, l2: l2 };
          state.panel = null;
          setPane("source");
          render();
          var pane = document.querySelector("#sourcePane .scroll");
          scrollInto(pane, pane.querySelector('.ln[data-n="' + l1 + '"]'));
        }
        function goTo(b) {
          var el = byAttr(document.getElementById("previewPane"), "data-src", key(b));
          scrollInto(previewPane(), el);
          flash(el);
          if (state.wide) {
            connect(key(b), true);
            setTimeout(function () {
              connect(key(b), false);
            }, 1800);
          }
        }
        function showInPreview(file, line) {
          var hit = blockFor(page(), file, line);
          if (!hit) {
            var other = -1;
            PAGES.forEach(function (p, i) {
              if (other < 0 && blockFor(p, file, line)) other = i;
            });
            if (other < 0) return;
            state.page = other;
            hit = blockFor(page(), file, line);
          }
          state.hl = { file: file, l1: line, l2: line };
          reveal(hit);
          if (!state.wide && threadsOn() && threadsFor(hit.b).length) state.panel = key(hit.b);
          setPane("preview");
          render();
          goTo(hit.b);
        }
        function stepChange(d) {
          if (state.mode !== "changes") {
            state.mode = "changes";
            render();
          }
          var n = changeEls.length;
          if (!n) return;
          var next = state.changeIdx + d;
          // Past the last change, offer the next changed page instead of wrapping round.
          if (next >= n) {
            state.atEnd = true;
            if (state.surface === "site") state.appOpen = true;
            render();
            return;
          }
          state.atEnd = false;
          state.changeIdx = Math.max(next, 0);
          var arm = changeEls[state.changeIdx].getAttribute("data-arm-of");
          if (arm) state.arm = arm;
          render();
          var el = changeEls[state.changeIdx];
          scrollInto(previewPane(), el);
          flash(el);
        }
        function refresh() {
          if (state.refreshed) return toast("Comments are up to date.");
          state.refreshed = true;
          THREADS[3].comments.push({
            who: "maya-okafor",
            when: "just now",
            body: "Found it: the Rollout history tab. Worth linking from here.",
          });
          toast("1 new comment on #128.");
        }
        function submit(msg) {
          THREADS.forEach(function (t) {
            t.comments.forEach(function (c) {
              if (c.pending) {
                c.pending = false;
                c.when = "just now";
              }
            });
          });
          state.submitOpen = false;
          toast(msg + " Your comments are now on GitHub.");
        }
        function discard() {
          THREADS = THREADS.filter(function (t) {
            t.comments = t.comments.filter(function (c) {
              return !c.pending;
            });
            return t.comments.length;
          });
          state.submitOpen = false;
          state.discardAsk = false;
          toast("Discarded your unsent comments.");
        }

        function ensureReview() {
          if (!threadsOn()) {
            state.scenario = "review";
            syncScenario();
          }
        }
        function tryThread(pageIdx, file, line) {
          ensureReview();
          state.page = pageIdx;
          state.file = PAGES[pageIdx].path;
          showInPreview(file, line);
        }
        var tries = {
          site: function () {
            state.surface = "site";
            setPane("preview");
            render();
          },
          fragment: function () {
            tryThread(state.page === 0 ? 1 : 0, F, 3);
          },
          hidden: function () {
            state.arm = "cloud";
            ensureReview();
            state.page = 0;
            state.file = R;
            setPane("preview");
            render();
            var x = blockFor(PAGES[0], R, 28);
            state.wide ? goTo(x.b) : showInPreview(R, 28);
          },
          details: function () {
            state.details = false;
            ensureReview();
            state.page = 0;
            state.file = R;
            setPane("preview");
            render();
            var x = blockFor(PAGES[0], R, 41);
            state.wide ? goTo(x.b) : showInPreview(R, 41);
          },
          removed: function () {
            ensureReview();
            state.page = 0;
            state.file = R;
            state.mode = "changes";
            setPane("preview");
            render();
            if (!state.wide) {
              state.panel = "rm1";
              render();
            }
            goTo({ rm: "rm1" });
          },
          blocked: function () {
            state.scenario = "ahead";
            syncScenario();
            state.surface = "rendered";
            state.page = 0;
            state.file = R;
            setPane("preview");
            render();
            var x = blockFor(PAGES[0], R, 41);
            reveal(x);
            startComment(x.b);
            render();
            goTo(x.b);
          },
          next: function () {
            if (!reviewOn()) {
              state.scenario = "review";
              syncScenario();
            }
            setPane("preview");
            render();
            stepChange(1);
          },
          conv: function () {
            ensureReview();
            state.page = 1;
            state.file = G;
            setPane("preview");
            render();
            var x = blockFor(PAGES[1], G, 18);
            startComment(x.b);
            render();
            goTo(x.b);
          },
        };
        Array.prototype.forEach.call(document.querySelectorAll("[data-try]"), function (b) {
          b.addEventListener("click", function () {
            tries[b.getAttribute("data-try")]();
          });
        });
        document.getElementById("scenario").addEventListener("change", function (e) {
          setScenario(e.target.value);
        });
        document.getElementById("paneSource").addEventListener("click", function () {
          setPane("source");
          render();
        });
        document.getElementById("panePreview").addEventListener("click", function () {
          setPane("preview");
          render();
        });
        document.addEventListener("keydown", function (e) {
          if (
            e.key === "Escape" &&
            (state.qp || state.composer || state.panel || state.submitOpen || state.list)
          ) {
            state.qp = null;
            state.composer = null;
            state.panel = null;
            state.submitOpen = false;
            state.list = false;
            render();
          }
        });

        function render() {
          renderSource();
          renderPreview();
          renderStatus();
        }
        render();

        // Re-render when the preview crosses the width where threads move between the column and the panel.
        var lastW = 0;
        function onResize() {
          var w = document.getElementById("previewPane").clientWidth;
          if (w === lastW) return;
          lastW = w;
          var site = state.surface === "site",
            wide = measure(w, site).wide;
          if (wide !== state.wide || site) render();
          else layoutColumn();
        }
        if (window.ResizeObserver)
          new ResizeObserver(onResize).observe(document.getElementById("previewPane"));
        else window.addEventListener("resize", onResize);
        window.addEventListener("load", layoutColumn);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutColumn);
      })();
    </script>
  </body>
</html>
