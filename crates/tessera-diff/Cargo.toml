[package]
name = "tessera-diff"
description = "What changed between a git revision and the working tree, page by page and block by block, as readers will see it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
similar = "2.7"
tessera-check.workspace = true
tessera-core.workspace = true
tessera-emit.workspace = true
tessera-model.workspace = true
tessera-resolve.workspace = true
tessera-syntax.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

[features]
# Derives a JSON Schema for each type it writes as JSON. Only tessera-cli's
# tests turn it on, to generate the schemas (crates/tessera-cli/src/shapes.rs).
json-schema = ["dep:schemars"]

[dev-dependencies]
proptest.workspace = true
tempfile = "3"

[lints]
workspace = true
