# TESSERA: this manifest replaces upstream comrak's. See FORK.md for what
# changed and why; the upstream manifest is comrak v0.55.0's Cargo.toml.
[package]
name = "comrak-tessera"
# The upstream release this fork is based on.
version = "0.55.0"
authors = [
    "Asherah Connor <ashe@kivikakk.ee>",
    "Brett Walker <github@digitalmoksha.com>",
    "gjtorikian",
]
description = "Ascribe's fork of comrak, a CommonMark and GFM parser, with Ascribe's block-level changes"
repository.workspace = true
license = "BSD-2-Clause"
edition = "2024"
rust-version = "1.85"
publish = false
build = "build.rs"
# The CLI (upstream src/main.rs) isn't vendored.
autobins = false
autoexamples = false
autobenches = false

[lib]
# Upstream's doctests import the crate as `comrak`. The library is renamed, so
# they would all fail to resolve; upstream's unit tests (src/tests) still run.
doctest = false

[dependencies]
typed-arena = "2.0.2"
emojis = { version = "0.9", optional = true }
arbitrary = { version = "1", optional = true, features = ["derive"] }
bon = { version = "3", optional = true }
caseless = "0.2"
jetscii = "0.5.3"
phf = "0.14"
rustc-hash = "2"
smallvec = "1.13"
finl_unicode = { version = "1.4.0", features = ["categories"] }

[dev-dependencies]
ntest = "0.10"
percent-encoding-rfc3986 = "0.1.3"
strum = { version = "0.28.0", features = ["derive"] }
toml = "1.0.6"
slug = "0.1.4"
pretty_assertions = "1.4.1"
glob = "0.3.3"

[build-dependencies]
entities = "1"
phf_codegen = "0.14"

[features]
# Upstream's default features are the CLI, syntect, and the `bon` builders.
# Ascribe needs none of them.
default = []
shortcodes = ["emojis"]
phoenix_heex = []
attributes = []
bon = ["dep:bon"]

[lints.rust]
# Upstream's `syntect` feature isn't vendored; its `cfg`s stay in the source
# untouched and are always off.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("syntect"))',
] }
# Upstream's own tests set an option upstream deprecated.
deprecated = "allow"

[lints.clippy]
# Upstream's code and tests trip these under the workspace's `clippy -D warnings`.
# Upstream code is left as it is, so every future merge stays clean.
vec_init_then_push = "allow"
write_with_newline = "allow"
collapsible_match = "allow"
int_plus_one = "allow"
manual_filter = "allow"
question_mark = "allow"
unnecessary_sort_by = "allow"
useless_borrows_in_formatting = "allow"
useless_conversion = "allow"
