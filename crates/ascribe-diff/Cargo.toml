[package]
name = "ascribe-diff"
description = "What changed between a git revision and the working tree, page by page and block by block, as readers will see it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
similar = "3.2"
ascribe-check.workspace = true
ascribe-core.workspace = true
ascribe-emit.workspace = true
ascribe-model.workspace = true
ascribe-resolve.workspace = true
ascribe-syntax.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

[features]
# Derives a JSON Schema for each type it writes as JSON. Only ascribe-cli's
# tests turn it on, to generate the schemas (crates/ascribe-cli/src/shapes.rs).
json-schema = ["dep:schemars", "ascribe-emit/json-schema"]

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile = "3"

[lints]
workspace = true
