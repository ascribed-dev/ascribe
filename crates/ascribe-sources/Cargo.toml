[package]
name = "ascribe-sources"
description = "Sources in another repository: copying the files a project's snippets use, and moving their pins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
ascribe-core.workspace = true
ascribe-model.workspace = true
ascribe-resolve.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

[features]
# Derives a JSON Schema for each type it writes as JSON. Only ascribe-cli's
# tests turn it on, to generate the schemas (crates/ascribe-cli/src/shapes.rs).
json-schema = ["dep:schemars"]

[dev-dependencies]
tempfile = "3"
# The tests check what `ascribe check` says of the copies they make.
ascribe-check.workspace = true

[lints]
workspace = true
