[package]
name = "ascribe-lsp"
description = "The Ascribe language server, run as ascribe lsp."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ascribe-core.workspace = true
ascribe-syntax.workspace = true
ascribe-model.workspace = true
ascribe-check.workspace = true
ascribe-resolve.workspace = true
ascribe-emit.workspace = true
ascribe-diff.workspace = true
ascribe-fmt.workspace = true
lsp-server = "0.10"
lsp-types = "0.97"
crossbeam-channel = "0.5"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

[features]
# Derives a JSON Schema for each type its custom requests answer with. Only
# ascribe-cli's tests turn it on, to generate the schemas
# (crates/ascribe-cli/src/shapes.rs).
json-schema = ["dep:schemars", "ascribe-diff/json-schema"]

[dev-dependencies]
tempfile = "3"
ascribe-synthetic.workspace = true

[[bench]]
name = "keystroke"
harness = false

[[bench]]
name = "completion"
harness = false

[lints]
workspace = true
