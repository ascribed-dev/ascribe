[package]
name = "tessera-cli"
description = "The tessera command-line tool: check, build, diff, fmt, and lsp."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ascribe"
path = "src/main.rs"

[dependencies]
ariadne.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tessera-check.workspace = true
tessera-core.workspace = true
tessera-diff.workspace = true
tessera-emit.workspace = true
tessera-fmt.workspace = true
tessera-lsp.workspace = true
tessera-model.workspace = true
tessera-sources.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The JSON Schemas of what the commands and the language server write, and the
# TypeScript generated from them (src/shapes.rs).
schemars.workspace = true
tessera-diff = { workspace = true, features = ["json-schema"] }
tessera-lsp = { workspace = true, features = ["json-schema"] }
tessera-sources = { workspace = true, features = ["json-schema"] }
insta.workspace = true
# Integration tests copy example projects to a temporary directory.
tempfile = "3"

[lints]
workspace = true
