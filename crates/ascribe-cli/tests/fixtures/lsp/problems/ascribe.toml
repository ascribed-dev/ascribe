[builds.site]
variants = "switch"
availability = "badge"

[builds.cloud]
variants = { deployment = "cloud" }
availability = { filter = "cloud" }

[builds.npm]
variants = { pm = "npm" }
availability = "badge"

[editor]
build = "site"
