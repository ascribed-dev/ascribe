[package]
name = "ascribe-cli"
description = "The ascribe command-line tool: check, build, diff, fmt, and lsp."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ascribe"
path = "src/main.rs"

[dependencies]
ariadne.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ascribe-check.workspace = true
ascribe-core.workspace = true
ascribe-diff.workspace = true
ascribe-emit.workspace = true
ascribe-fmt.workspace = true
ascribe-lsp.workspace = true
ascribe-model.workspace = true
ascribe-query.workspace = true
ascribe-resolve.workspace = true
ascribe-sources.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The JSON Schemas of what the commands and the language server write, and the
# TypeScript generated from them (src/shapes.rs).
schemars.workspace = true
ascribe-diff = { workspace = true, features = ["json-schema"] }
ascribe-lsp = { workspace = true, features = ["json-schema"] }
ascribe-query = { workspace = true, features = ["json-schema"] }
ascribe-sources = { workspace = true, features = ["json-schema"] }
insta.workspace = true
# Integration tests copy example projects to a temporary directory.
tempfile = "3"

[lints]
workspace = true
