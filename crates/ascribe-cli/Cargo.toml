[package]
name = "ascribe-cli"
# The short form in design/words.toml, which scripts/design/words.test.ts
# compares: `ascribe --help` opens with it, and the plugin's description
# starts with it.
description = "A toolchain for documentation written as code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ascribe"
path = "src/main.rs"

[dependencies]
ariadne.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
ascribe-check.workspace = true
ascribe-workspace.workspace = true
ascribe-core.workspace = true
ascribe-diff.workspace = true
ascribe-edit.workspace = true
ascribe-emit.workspace = true
ascribe-fmt.workspace = true
ascribe-lsp.workspace = true
ascribe-mcp.workspace = true
ascribe-model.workspace = true
ascribe-query.workspace = true
ascribe-resolve.workspace = true
ascribe-sources.workspace = true
ascribe-templates.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The JSON Schemas of what the commands and the language server write, and the
# TypeScript generated from them (src/shapes.rs).
schemars.workspace = true
ascribe-diff = { workspace = true, features = ["json-schema"] }
ascribe-emit = { workspace = true, features = ["json-schema"] }
ascribe-lsp = { workspace = true, features = ["json-schema"] }
ascribe-query = { workspace = true, features = ["json-schema"] }
ascribe-sources = { workspace = true, features = ["json-schema"] }
ascribe-templates = { workspace = true, features = ["json-schema"] }
insta.workspace = true
# Integration tests copy example projects to a temporary directory.
tempfile = "3"

[lints]
workspace = true
