packages:
  - packages/*
  - packages/cli/platforms/*
  - tests/zod
  - examples/astro-site
# esbuild ships its binary in a per-platform package; its postinstall script
# only swaps in a faster launcher, so it need not run. vsce-sign's installs a
# signing tool that packaging and publishing don't use. @scarf/scarf, which
# Stoplight Elements brings, reports the install to its publisher.
allowBuilds:
  "@scarf/scarf": false
  "@vscode/vsce-sign": false
  esbuild: false
