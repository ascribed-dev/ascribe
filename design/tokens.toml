# Ascribe's colors, font stacks, type scale, spaces, and radii: the only place
# one is written. The stylesheets' variables are generated from this file by
# scripts/design/tokens.ts; design/README.md says how.
#
# [palette]: every color value, named by hue and step. The step is
# 1000 × (1 − the color's OKLCH lightness), rounded, so a higher step is
# darker; a tie takes the next step. Only [color] points here, never a
# stylesheet.
#
# [color]: what a color is for, with a light and a dark value, each a
# palette name. Where two surfaces use near-identical values for one idea,
# each keeps its own token for now.
#
# [font], [space], [radius], [type]: values the stylesheets use as they are.
#
# [emit]: each stylesheet's generated blocks, by the name its markers give:
# the property each declares, and the token it takes. A value with `{…}` is
# a template, its tokens in braces.

