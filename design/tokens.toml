[font]
ui = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
# Review's code and paths.
review-mono = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace'
# The review overlay's, when the page sets no --ascribe-review-font.
overlay-ui = 'system-ui, -apple-system, "Segoe UI", sans-serif'
# Fallbacks for when a host gives no font of its own.
fallback-ui = "system-ui, sans-serif"
fallback-mono = "ui-monospace, monospace"

[space]
base = "1rem"
small = "0.5rem"

[radius]
base = "0.375rem"

# The type scale: weight, size, and line height, for the `font` shorthand
# with a family after it.
[type]
caption = "600 0.75rem/1.4"
small = "400 0.875rem/1.5"
body = "400 1rem/1.6"
lead = "400 1.125rem/1.55"
h3 = "650 1.125rem/1.4"
h2 = "650 1.375rem/1.3"
h1 = "700 1.875rem/1.2"

