# Ascribe's colors, font stacks, type scale, spaces, and radii: the only place
# a color is written, and the home of a new font stack, size, or space. The stylesheets' variables are generated from this file by
# scripts/design/tokens.ts; design/README.md says how.
#
# [palette]: every color value, named by hue and step. The step is
# 1000 × (1 − the color's OKLCH lightness), rounded, so a higher step is
# darker; a tie takes the next step. Only [color] points here, never a
# stylesheet.
#
# [color]: what a color is for, with a light and a dark value, each a
# palette name. The element library, review, the HTML report, the Astro
# toolbar, and the docs site share the top-level ones (`color.text`,
# `color.note`); a color only one surface uses is under its name
# (`color.preview.error`). The mark's colors are under `color.brand`: the
# images of the mark take them (scripts/design/assets.ts), so they need no
# stylesheet.
#
# [font], [space], [radius], [type]: values the stylesheets use as they are.
#
# [type]: the type scale, each step a weight, a size, and a line height, as
# the `font` shorthand writes them.
#
# [emit]: each stylesheet's generated blocks, by the name its markers give:
# the property each declares, and the token it takes. A value with `{…}` is
# a template, its tokens in braces.

# The palette ---------------------------------------------------------------
#
# Bryo Studio's Deep River, for dark, and Shallows, its light companion from
# the same hues (project-docs/brand/identity.md). Deep is the neutrals, river
# the accent and what changed, moss a tip and what was added, and amber focus.
# Red, magenta, and yellow are the notes' and review's other colors, tuned to
# Deep River's cool cast and kept apart from moss, river, and amber for a
# reader with red-green color blindness (design/candidates/pairs.toml).

[palette.deep]
0 = "#ffffff"
27 = "#f2f7f9"
51 = "#e3f1f7"
56 = "#e6eef2"
66 = "#e1ebf1"
70 = "#deeaf0"
115 = "#ccdce4"
290 = "#8aa6b8"
525 = "#47606f"
661 = "#263a4b"
699 = "#1f303e"
754 = "#112233"
796 = "#0b1824"
827 = "#07111b"
# Deep River's ground at an opacity, by its percent.
a40 = "rgb(11 24 36 / 0.4)"

[palette.river]
46 = "#dff4fc"
80 = "#c5ecfa"
199 = "#56d0f0"
413 = "#1689ab"
494 = "#0b6f8e"
671 = "#0b3a4f"
711 = "#0b2f40"

[palette.moss]
45 = "#e5f6e3"
81 = "#cfefcb"
169 = "#9fdc7c"
433 = "#3f8a3a"
528 = "#2f6b2b"
669 = "#1b3f1d"
710 = "#1a321b"

[palette.amber]
65 = "#ffe4cc"
223 = "#f0a35e"
445 = "#b4530f"
670 = "#4d2c15"

[palette.red]
40 = "#ffedec"
299 = "#ed7477"
455 = "#ca223c"
710 = "#481b1c"
731 = "#3d1a1b"

[palette.magenta]
41 = "#f6eefc"
320 = "#b180d4"
579 = "#6b2094"
710 = "#362045"
730 = "#2f1e3a"

[palette.yellow]
39 = "#fdf1d8"
341 = "#b38c15"
619 = "#583d01"
729 = "#32240a"

# Black at an opacity, by its percent.
[palette.black]
a22 = "rgb(0 0 0 / 0.22)"
a30 = "rgb(0 0 0 / 0.3)"

# The review overlay's bottom sheet.
[color.review.shadow]
light = "black.a22"
dark = "black.a22"

# The Astro toolbar's panel.
[color.toolbar.shadow]
light = "black.a30"
dark = "black.a30"

# The VS Code preview: fallbacks for when the editor's theme gives none ------

# One value for both schemes, since the editor's theme can be either: the
# caution's red and the dark warning's gold, which read on light and dark.
[color.preview.error]
light = "red.455"
dark = "red.455"

[color.preview.warning]
light = "yellow.341"
dark = "yellow.341"

# Behind a site's page, before it paints.
[color.preview.frame]
light = "deep.0"
dark = "deep.0"

# The mark -------------------------------------------------------------------

# The mark's letters, and text beside it: the social cards' titles.
[color.brand.ink]
light = "deep.796"
dark = "deep.51"

# The social card's line under the wordmark.
[color.brand.muted]
light = "deep.525"
dark = "deep.290"

# The gutter's change marks beside the a: the mark's second color.
[color.brand.gutter]
light = "river.413"
dark = "river.199"

# The change marks once the change is reviewed, in the mark's motion.
[color.brand.reviewed]
light = "moss.433"
dark = "moss.169"

# Behind the mark: the icons' tiles, the social cards, the avatar.
[color.brand.ground]
light = "deep.27"
dark = "deep.796"

# A panel on the ground.
[color.brand.surface]
light = "deep.0"
dark = "deep.754"

# Shared ----------------------------------------------------------------------

# Ascribe's own pages: the docs site, the element library, review, the HTML
# report, and the Astro toolbar. Shallows in light and Deep River in dark: the
# background is the mark's ground, and a surface is a panel on it.
[color.text]
light = "deep.796"
dark = "deep.51"

[color.muted]
light = "deep.525"
dark = "deep.290"

[color.background]
light = "deep.27"
dark = "deep.796"

# Panels, code, and table headers on the background.
[color.surface]
light = "deep.0"
dark = "deep.754"

[color.border]
light = "deep.115"
dark = "deep.661"

# Links, the current page, steps' markers, the selected tab, and review's links
# and primary buttons: river, the mark's change marks.
[color.accent]
light = "river.494"
dark = "river.199"

# Text on the accent or the focus color: a step's number, a button's label.
[color.accent-text]
light = "deep.0"
dark = "deep.796"

# A panel that shows on a white page as on the background, where the surface
# wouldn't: a review thread, a tab under the pointer.
[color.panel]
light = "deep.66"
dark = "deep.699"

[color.code-background]
light = "deep.56"
dark = "deep.827"

# Behind accent text: the current page in a list, a search match.
[color.accent-surface]
light = "river.46"
dark = "river.711"

# Focus rings and outlines, and nothing else: amber.
[color.focus]
light = "amber.445"
dark = "amber.223"

# Notes, each a color and a tinted background: a note is river, a tip moss,
# an important note magenta, a warning yellow, and a caution red.
[color.note]
light = "river.494"
dark = "river.199"

[color.note-background]
light = "river.46"
dark = "river.711"

[color.tip]
light = "moss.528"
dark = "moss.169"

[color.tip-background]
light = "moss.45"
dark = "moss.710"

[color.important]
light = "magenta.579"
dark = "magenta.320"

[color.important-background]
light = "magenta.41"
dark = "magenta.730"

[color.warning]
light = "yellow.619"
dark = "yellow.341"

[color.warning-background]
light = "yellow.39"
dark = "yellow.729"

[color.caution]
light = "red.455"
dark = "red.299"

[color.caution-background]
light = "red.40"
dark = "red.731"

# An availability state with no color of its own; the others take a note's.
[color.state]
light = "deep.525"
dark = "deep.290"

[color.state-background]
light = "deep.70"
dark = "deep.699"

# Review's marks: added is moss, changed river, as the mark's change marks
# are, removed red, and moved magenta.
[color.added]
light = "moss.528"
dark = "moss.169"

[color.added-background]
light = "moss.81"
dark = "moss.669"

[color.changed]
light = "river.494"
dark = "river.199"

[color.changed-background]
light = "river.80"
dark = "river.671"

[color.removed]
light = "red.455"
dark = "red.299"

[color.removed-background]
light = "red.40"
dark = "red.710"

[color.moved]
light = "magenta.579"
dark = "magenta.320"

[color.moved-background]
light = "magenta.41"
dark = "magenta.710"

# A block that was just scrolled to: amber, focus's hue.
[color.flash]
light = "amber.65"
dark = "amber.670"
# Behind a dialog: the docs site's search, review's dialogs. Deep River's
# ground, so the page dims toward it.
[color.scrim]
light = "deep.a40"
dark = "deep.a40"

[font]
ui = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
# Headings on the docs site and in the HTML report's frame: the system's
# serif, which is New York on Apple's systems, then Charter, the brand's
# reading face, and the serifs Windows and Linux have. No font ships
# (decision 48).
heading = 'ui-serif, Charter, "Bitstream Charter", Cambria, Georgia, serif'
# Review's code and paths.
review-mono = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace'
# The review overlay's, when the page sets no --ascribe-review-font.
overlay-ui = 'system-ui, -apple-system, "Segoe UI", sans-serif'
# Fallbacks for when a host gives no font of its own.
fallback-ui = "system-ui, sans-serif"
fallback-mono = "ui-monospace, monospace"

[space]
base = "1rem"
small = "0.5rem"

[radius]
base = "0.375rem"

# The type scale: weight, size, and line height, for the `font` shorthand
# with a family after it. A compact scale, about 1.2 from step to step, with
# heavier headings. The docs site and the HTML report's frame set their text
# with it; the element library takes the site's type.
[type]
caption = "600 0.75rem/1.4"
small = "400 0.875rem/1.5"
body = "400 1rem/1.6"
lead = "400 1.125rem/1.55"
h3 = "650 1.125rem/1.4"
h2 = "650 1.375rem/1.3"
h1 = "700 1.875rem/1.2"
# The heading of a page outside the docs, in its hero: the site's landing page.
hero = "750 2.75rem/1.1"

