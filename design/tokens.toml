"--ascribe-state-deprecated-color" = "var(--vscode-charts-yellow, {color.elements.state.deprecated})"
"--ascribe-state-removed-color" = "var(--vscode-charts-red, {color.elements.state.removed})"
"--ascribe-review-added" = "var(--vscode-gitDecoration-addedResourceForeground, {color.review.added})"
"--ascribe-review-changed" = "var(--vscode-gitDecoration-modifiedResourceForeground, {color.review.changed})"
"--ascribe-review-removed" = "var(--vscode-gitDecoration-deletedResourceForeground, {color.review.removed})"
"--ascribe-review-moved" = "var(--vscode-charts-purple, {color.review.moved})"
"--ascribe-review-muted" = "var(--vscode-descriptionForeground, {color.review.muted})"
"--ascribe-review-flash" = "color-mix(in srgb, var(--vscode-editor-findMatchHighlightBackground, {color.review.flash}) 50%, var(--vscode-editor-background, Canvas))"
"--ascribe-review-focus" = "var(--vscode-textLink-foreground, {color.review.focus})"
"--ascribe-review-mono" = "var(--vscode-editor-font-family, {font.fallback-mono})"
"--ascribe-review-border" = "var(--vscode-widget-border, var(--vscode-panel-border, {color.review.border}))"
"--ascribe-review-font" = "var(--vscode-font-family, {font.fallback-ui})"

[emit."packages/vscode/src/webview/preview.css".body]
"font-family" = "var(--vscode-font-family, {font.fallback-ui})"

[emit."packages/vscode/src/webview/preview.css".error]
"color" = "var(--vscode-errorForeground, {color.preview.error})"

[emit."packages/vscode/src/webview/preview.css".warning]
"color" = "var(--vscode-editorWarning-foreground, {color.preview.warning})"

[emit."packages/vscode/src/webview/preview.css".frame]
"background" = "color.preview.frame"
