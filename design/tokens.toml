# Ascribe's colors, font stacks, spaces, and radii: the only place one is
# written. The stylesheets' variables are generated from this file by
# scripts/design/tokens.ts; design/README.md says how.
#
# [palette]: every color value, named by hue and step. The step is
# 1000 × (1 − the color's OKLCH lightness), rounded, so a higher step is
# darker; a tie takes the next step. Only [color] points here, never a
# stylesheet.
#
# [color]: what a color is for, with a light and a dark value, each a
# palette name. The element library, review, the HTML report, and the Astro
# toolbar share the top-level ones (`color.text`, `color.note`); the docs site
# and the VS Code preview have their own (`color.site.text`).
#
# [font], [space], [radius]: values the stylesheets use as they are.
#
# [type]: the type scale, each step a size, a line height, and a weight.
#
# [emit]: each stylesheet's generated blocks, by the name its markers give:
# the property each declares, and the token it takes. A value with `{…}` is
# a template, its tokens in braces.

# The palette ---------------------------------------------------------------

[palette.neutral]
0 = "#ffffff"
18 = "#f7f9fd"
37 = "#f0f3f7"
76 = "#e3e6ec"
266 = "#a5a9b2"
470 = "#676c75"
640 = "#393d46"
729 = "#22272e"
796 = "#13171f"
831 = "#0c0f16"

[palette.indigo]
25 = "#f5f6fe"
180 = "#b3c0ff"
265 = "#91a1fe"
435 = "#5962e8"
511 = "#474dc6"
764 = "#161b3a"

[palette.green]
25 = "#e1fff2"
56 = "#c7fae5"
266 = "#22c598"
509 = "#057256"
694 = "#003929"
764 = "#02251a"

[palette.amber]
26 = "#fef5eb"
56 = "#fee9d0"
264 = "#e0992e"
510 = "#845502"
694 = "#432900"
765 = "#2b1a03"

[palette.red]
26 = "#fef4f1"
265 = "#fe7f57"
436 = "#ca3f02"
470 = "#cc0000"
509 = "#a73303"
696 = "#511b0a"
764 = "#341308"

[palette.magenta]
26 = "#fff2fd"
104 = "#ffc8f9"
510 = "#932f8e"
695 = "#461c43"
764 = "#2d132b"

# The docs site's own colors, and the VS Code preview's fallbacks.
[palette.gray]
22 = "#f6f8fa"
57 = "#e6edf3"
119 = "#d1d9e0"
323 = "#9198a1"
505 = "#59636e"
616 = "#3d444d"
746 = "#1f2328"
780 = "#151b23"
824 = "#0d1117"

[palette.blue]
46 = "#ddf4ff"
337 = "#4493f8"
460 = "#0969da"
770 = "#121d2f"

[palette.yellow]
341 = "#bb8800"

# Black at an opacity, by its percent.
[palette.black]
a22 = "rgb(0 0 0 / 0.22)"
a30 = "rgb(0 0 0 / 0.3)"
a40 = "rgb(0 0 0 / 0.4)"

# Shared: the element library, review's marks and overlay, the HTML report's
# frame, and the Astro toolbar's panel take these ---------------------------

[color]
text = { light = "neutral.729", dark = "neutral.37" }
muted = { light = "neutral.470", dark = "neutral.266" }
background = { light = "neutral.0", dark = "neutral.831" }
# A raised area: a sidebar, a thread, a tab under the pointer.
surface = { light = "neutral.18", dark = "neutral.796" }
border = { light = "neutral.76", dark = "neutral.640" }
# Steps' markers, the selected tab, links, and primary buttons.
accent = { light = "indigo.435", dark = "indigo.265" }
# Text on the accent or the focus color: a step's number, a button's label.
accent-text = { light = "neutral.0", dark = "neutral.831" }
code-background = { light = "neutral.18", dark = "neutral.796" }
# Focus rings, and review's links and primary buttons.
focus = { light = "indigo.435", dark = "indigo.180" }

# Notes, each a color and a tinted background.
note = { light = "indigo.511", dark = "indigo.265" }
note-background = { light = "indigo.25", dark = "indigo.764" }
tip = { light = "green.509", dark = "green.266" }
tip-background = { light = "green.25", dark = "green.764" }
important = { light = "magenta.510", dark = "magenta.104" }
important-background = { light = "magenta.26", dark = "magenta.764" }
warning = { light = "amber.510", dark = "amber.264" }
warning-background = { light = "amber.26", dark = "amber.765" }
caution = { light = "red.509", dark = "red.265" }
caution-background = { light = "red.26", dark = "red.764" }
# An availability state with no color of its own; the others take a note's.
state = { light = "neutral.470", dark = "neutral.266" }
state-background = { light = "neutral.37", dark = "neutral.729" }

# Review's marks.
added = { light = "green.509", dark = "green.266" }
added-background = { light = "green.56", dark = "green.694" }
changed = { light = "amber.510", dark = "amber.264" }
changed-background = { light = "amber.56", dark = "amber.694" }
removed = { light = "red.436", dark = "red.265" }
removed-background = { light = "red.26", dark = "red.696" }
moved = { light = "magenta.510", dark = "magenta.104" }
moved-background = { light = "magenta.26", dark = "magenta.695" }
# A block that was just scrolled to.
flash = { light = "amber.56", dark = "amber.694" }

# The review overlay's bottom sheet.
[color.review.shadow]
light = "black.a22"
dark = "black.a22"

# The Astro toolbar's panel.
[color.toolbar.shadow]
light = "black.a30"
dark = "black.a30"

# The docs site ---------------------------------------------------------------

[color.site.text]
light = "gray.746"
dark = "gray.57"

[color.site.muted]
light = "gray.505"
dark = "gray.323"

[color.site.background]
light = "neutral.0"
dark = "gray.824"

[color.site.surface]
light = "gray.22"
dark = "gray.780"

[color.site.border]
light = "gray.119"
dark = "gray.616"

[color.site.accent]
light = "blue.460"
dark = "blue.337"

[color.site.accent-surface]
light = "blue.46"
dark = "blue.770"

[color.site.code-background]
light = "gray.22"
dark = "gray.780"

# The VS Code preview: fallbacks for when the editor's theme gives none ------

[color.preview.error]
light = "red.470"
dark = "red.470"

[color.preview.warning]
light = "yellow.341"
dark = "yellow.341"

# Behind a site's page, before it paints.
[color.preview.frame]
light = "neutral.0"
dark = "neutral.0"

# Shared ----------------------------------------------------------------------

# Behind a dialog: the docs site's search, review's dialogs.
[color.scrim]
light = "black.a40"
dark = "black.a40"

[font]
ui = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
# Review's code and paths.
review-mono = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace'
# The review overlay's, when the page sets no --ascribe-review-font.
overlay-ui = 'system-ui, -apple-system, "Segoe UI", sans-serif'
# Fallbacks for when a host gives no font of its own.
fallback-ui = "system-ui, sans-serif"
fallback-mono = "ui-monospace, monospace"

# The type scale, for the text Ascribe's own pages set: the HTML report's
# frame. A compact scale, about 1.2 from step to step, with heavier headings.
# The element library takes the site's type instead.
[type]
caption = { size = "0.75rem", line = 1.4, weight = 600 }
small = { size = "0.875rem", line = 1.5, weight = 400 }
body = { size = "1rem", line = 1.6, weight = 400 }
h1 = { size = "1.875rem", line = 1.2, weight = 700 }

[space]
base = "1rem"
small = "0.5rem"

[radius]
base = "0.375rem"

# What each stylesheet declares ---------------------------------------------

[emit."packages/elements/css/style.css".spacing]
"--ascribe-space" = "space.base"
"--ascribe-space-small" = "space.small"
"--ascribe-border-color" = "color.border"
"--ascribe-radius" = "radius.base"

[emit."packages/elements/css/style.css".text]
