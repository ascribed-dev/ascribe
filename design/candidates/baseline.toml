# Today's colors and type, as the stylesheets set them: mostly GitHub's
# Primer. Where two stylesheets disagree on a value for the same thing, this
# takes the docs site's for the chrome and the element library's for notes
# and badges; review's marks keep their own.

[candidate]
name = "Baseline"
summary = "Today's values, to compare against."
baseline = true

[palette.gray]
0 = "#ffffff"
50 = "#f6f8fa"
75 = "#e6edf3"
100 = "#eaeef2"
200 = "#d1d9e0"
400 = "#9198a1"
600 = "#59636e"
700 = "#3d444d"
800 = "#212830"
850 = "#1f2328"
900 = "#151b23"
950 = "#0d1117"

[palette.blue]
50 = "#ddf4ff"
400 = "#4493f8"
450 = "#5aa2ff"
500 = "#1f6feb"
600 = "#0969da"
950 = "#121d2f"

[palette.green]
50 = "#dafbe1"
75 = "#dcf7e3"
400 = "#4fc572"
500 = "#3fb950"
600 = "#1a7f37"
900 = "#133520"
950 = "#12261e"

[palette.yellow]
50 = "#fff8c5"
75 = "#fff6bf"
100 = "#fff1c2"
400 = "#dcb13a"
500 = "#d29922"
600 = "#9a6700"
700 = "#8a5a00"
900 = "#3b3514"
925 = "#3a2f0d"
950 = "#272115"

[palette.red]
50 = "#ffebe9"
75 = "#ffe4e2"
400 = "#ff8279"
500 = "#f85149"
600 = "#cf222e"
700 = "#c4222d"
900 = "#401918"
950 = "#2d1517"

[palette.purple]
50 = "#fbefff"
75 = "#f0e6ff"
400 = "#c59bff"
500 = "#ab7df8"
600 = "#8250df"
700 = "#7a3fd0"
900 = "#2d2440"
950 = "#1f1a33"

[color]
text = { light = "gray.850", dark = "gray.75" }
muted = { light = "gray.600", dark = "gray.400" }
background = { light = "gray.0", dark = "gray.950" }
surface = { light = "gray.50", dark = "gray.900" }
border = { light = "gray.200", dark = "gray.700" }
accent = { light = "blue.600", dark = "blue.400" }
accent-surface = { light = "blue.50", dark = "blue.950" }
accent-text = { light = "gray.0", dark = "gray.950" }
code-background = { light = "gray.50", dark = "gray.900" }
focus = { light = "blue.500", dark = "blue.450" }

note = { light = "blue.600", dark = "blue.400" }
note-background = { light = "blue.50", dark = "blue.950" }
tip = { light = "green.600", dark = "green.500" }
tip-background = { light = "green.50", dark = "green.950" }
important = { light = "purple.600", dark = "purple.500" }
important-background = { light = "purple.50", dark = "purple.950" }
warning = { light = "yellow.600", dark = "yellow.500" }
warning-background = { light = "yellow.50", dark = "yellow.950" }
caution = { light = "red.600", dark = "red.500" }
caution-background = { light = "red.50", dark = "red.950" }
state = { light = "gray.600", dark = "gray.400" }
state-background = { light = "gray.100", dark = "gray.800" }

added = { light = "green.600", dark = "green.400" }
added-background = { light = "green.75", dark = "green.900" }
changed = { light = "yellow.700", dark = "yellow.400" }
changed-background = { light = "yellow.100", dark = "yellow.925" }
removed = { light = "red.700", dark = "red.400" }
removed-background = { light = "red.75", dark = "red.900" }
moved = { light = "purple.700", dark = "purple.400" }
moved-background = { light = "purple.75", dark = "purple.900" }
flash = { light = "yellow.75", dark = "yellow.900" }

[font]
ui = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

# The type scale: each step's size, line height, and weight. The docs site's
# sizes today.
[type]
caption = { size = "0.75rem", line = 1.5, weight = 600 }
small = { size = "0.875rem", line = 1.5, weight = 400 }
body = { size = "1rem", line = 1.6, weight = 400 }
lead = { size = "1.125rem", line = 1.6, weight = 400 }
h3 = { size = "1.25rem", line = 1.25, weight = 600 }
h2 = { size = "1.5rem", line = 1.25, weight = 600 }
h1 = { size = "2rem", line = 1.25, weight = 600 }
