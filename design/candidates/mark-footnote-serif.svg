<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Footnote: Source Serif 4</title>
  <desc>A lowercase a with a raised asterisk, both outlined from Source Serif 4 Bold (SIL Open Font License, which allows outlines in a logo): a word with a note on it, the plainest sign that something is cited. The wordmark is Source Serif 4 Semibold, outlined. A serif a, bookish, like a footnote in a printed text, and the strongest contrast to the sans-serif pages. Weak because the pages are set in system sans-serif, so the lockup doesn't match them.</desc>
