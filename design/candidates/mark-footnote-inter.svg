<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Footnote: Inter</title>
  <desc>A lowercase a with a raised asterisk, both outlined from Inter Bold (SIL Open Font License, which allows outlines in a logo): a word with a note on it, the plainest sign that something is cited. The wordmark is Inter Semibold, outlined. Inter is the closest open font to the system UI fonts the site uses (San Francisco, Segoe UI), so the lockup sits beside the site's own type. Weak in being everywhere: many products set their name in Inter.</desc>
