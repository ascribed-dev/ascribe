# Bryo Studio's Deep River, for dark, and Shallows, its light companion from
# the same hues: deep blue-gray neutrals, river blue for the accent and what
# changed, moss for a tip and what was added, and amber for focus. Red,
# magenta, and yellow are tuned to the same cool cast, and kept apart from
# moss, river, and amber for red-green color blindness: red leans crimson and
# magenta violet, so they differ from moss and river in blue and lightness as
# well as in red and green.

[candidate]
name = "Deep River and Shallows"
summary = "The chosen palette and type scale: Deep River in dark and Shallows in light, from the mark's colors; tighter, heavier headings."

# Each hue's steps are made in OKLCH at fixed lightnesses, so the same step of
# two hues has about the same lightness, and named as design/tokens.toml names
# them: 1000 × (1 − the color's OKLCH lightness), rounded, so a higher step is
# darker.
#
# The shared colors, and the palette steps they take, are generated from
# design/tokens.toml: change them there, then run
# `ASCRIBE_BLESS=1 pnpm exec vitest run scripts/design/tokens.test.ts`.
# design/README.md says how.

# Generated from design/tokens.toml by scripts/design/tokens.ts: the shared colors.
