[font]
ui = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

# A compact scale, about 1.2 from step to step, with heavier headings.
[type]
caption = { size = "0.75rem", line = 1.4, weight = 600 }
small = { size = "0.875rem", line = 1.5, weight = 400 }
body = { size = "1rem", line = 1.6, weight = 400 }
lead = { size = "1.125rem", line = 1.55, weight = 400 }
h3 = { size = "1.125rem", line = 1.4, weight = 650 }
h2 = { size = "1.375rem", line = 1.3, weight = 650 }
h1 = { size = "1.875rem", line = 1.2, weight = 700 }
