# Ascribe's `quiet` preset: Vale rules that are almost never wrong.
StylesPath = .vale
MinAlertLevel = suggestion
# Bold text in documentation is mostly a label from a user interface, which
# the writer doesn't choose: "click **Click to send**".
IgnoredScopes = code, tt, strong, b

[*.md]
BasedOnStyles = Ascribe, Docs

# Contracts define terms, sometimes in one long sentence, and may use the
# compiler's words. Their text changes only by a recorded decision, so the
# settled terms and openings aren't asked of them here either. The path is
# from the folder `ascribe.toml` is in.
[content/contracts/**/*.md]
Docs.SentenceLength = NO
Docs.Vocabulary = NO
Docs.KeyRule = NO
Docs.Terms = NO
Docs.PartOf = NO

# Generated from the code's own text (the commands' help, diagnostics.toml,
# the content model's schema): a word there is changed at its source. The
# settled terms are held there by scripts/docs-site/terms.test.ts, which reads
# Docs/Terms.yml and leaves out what these pages quote from SPEC and the
# diagnostics' messages.
[content/_generated/*.md]
Docs.SentenceLength = NO
Docs.Vocabulary = NO
Docs.KeyRule = NO
Docs.Terms = NO
