# The content model for Ascribe's user docs. The pages are in content/.
spec = "0.1"

[project]
content-root = "content"
output-dir = ".ascribe/build"

# Every page names its type with `type:` in its frontmatter, and every type
# has the fields in `[frontmatter]`. Titles can show code ("`ascribe.toml`
# reference"); the site's layout uses the formatted title for the heading and
# the sidebar. A field named `description` is the page's description, which
# the checks and llms.txt read.
[frontmatter]
title = { type = "string", inline = "code" }
description = "string"

# The home page, a list of the other pages. No template is for a landing page,
# so the type has nothing of its own.
[types.index]

# Five of the types are the set's, from `ascribe templates eject`: each one's
# template and guide are in templates/, with Ascribe's notes on it, and
# templates/templates.lock records where they came from, which is where each
# type takes them from. What the set's types don't have is put back here:
# each type's purpose.

# The reference's template is the set's, taken with `ascribe templates eject
# reference --keep-type`; the type is the docs' own. The contracts are written
# for implementers but shaped as references, and the editor's pages are its
# reference.
[types.reference]
purpose = "Looking up a command, a key of ascribe.toml, a directive, a diagnostic, the editor's features and settings, or a contract's rules."

# The set's other four types, from `ascribe templates eject`.
[types.how-to]
purpose = "Doing one thing with Ascribe once you know what it is: publishing a site, reviewing a pull request, keeping examples in step with code, setting up an agent, checking prose, acting on a report, publishing permalinks, taking the page templates, keeping a page's reasons in memos, or setting up a glossary."

[types.tutorial]
purpose = "Learning Ascribe by building an example project a step at a time: a first project, then content that varies."

[types.concept]
purpose = "Understanding an idea behind the docs a team publishes, such as what Ascribe can't measure and where to look instead."

[types.troubleshooting]
purpose = "Finding out why something isn't working, from what it shows, and what to do about it."

# Commands that differ by package manager. The site shows them as tabs, and a
# reader's choice holds on every page.
[dimensions.pm]
label = "Package manager"
values = ["npm", "pnpm"]

# The releases the docs know of: the latest release is the live line, and
# the one `main` is building is planned. Earlier releases aren't declared: a
# mark for one is before the window and reads as written. RELEASING.md's
# step moves the lines when a release ships, and rewrites each `planned` to
# the released version.
#
# What isn't in the latest release is marked with availability. A feature in
# `main` that no release has yet is `@available: ascribe planned`, the
# planned line in `[releases.ascribe]`, so the page reads "planned". When a release ships it,
# the line moves to `live` and the same marks read "since <version>".
# Something that shipped in an earlier release says so directly:
# `@available: ascribe 0.1.1`. `ascribe` is a value of the implicit `release`
# dimension, since no declared dimension has it.
[releases]
planned-label = "in main, not yet released"

[releases.ascribe]
label = "Ascribe"
live = ["0.4.3"]
planned = ["0.4.4"]

[releases.ascribe.archived]
"0.3.1" = {}
"0.3.2" = {}
"0.4.0" = {}
"0.4.1" = {}
"0.4.2" = {}

[phrases]
# The latest release: `[releases.ascribe]`'s live line, which
# tests/conformance/tests/docs.rs compares with the workspace version in
# Cargo.toml and every package.json under packages/.
version = { line = "ascribe" }
# `engines.node` in package.json. scripts/docs-site/facts.test.ts checks it,
# and every other file that names the Node version.
node = "24"
# The oldest glibc the Linux binaries run on: `GLIBC` in
# .github/workflows/release-build.yml. scripts/docs-site/facts.test.ts checks it.
glibc = "2.28"
# `engines.vscode` in packages/vscode/package.json.
vscode = "1.138"
# The repository. Link to a file as `{repo}/blob/main/<path>`, and to a folder
# as `{repo}/tree/main/<path>`.
repo = "https://github.com/ascribed-dev/ascribe"

# A picture of the editor is one for each scheme, `![…](images/status-bar-light.png){scheme=light}`
# beside its dark one, as on the site's own pages; the site shows the
# reader's (site/src/styles/site.css). A picture for both leaves it out.
[images.attributes]
scheme = "enum(light, dark)?"

[glossary]
match = "first"
pages = ["glossary.md"]

# Where the pages' code examples come from: files in this repository that are
# built, tested, or run, taken with `@snippet`. Netlify builds from a clone of
# the whole repository, so they're there in production too.
# Code examples come from these files. The same folders are listed in three
# other places, which need the same change when `include` changes: the paths
# in .github/workflows/site-npm.yml, the site path pattern in
# .github/workflows/ci.yml, and `ignore` in site/netlify.toml. Those three
# also name CHANGELOG.md, which the site renders as its changelog, and the
# source's ascribe.examples.toml and examples.observations/, which say what
# the examples were tested with. scripts/docs-site/facts.test.ts fails until
# they agree.
[sources.code]
path = ".."                               # relative to the folder ascribe.toml is in
include = [                               # what's readable; everything else isn't
  ".github/workflows/**",
  "crates/ascribe-cli/tests/output/**",
  "examples/**",
  "packages/astro/starter/**",
  "site/demo/**",
]

# How the site in site/ routes. @ascribed/astro gives Astro its `site` and
# `trailingSlash` from here (site/astro.config.mjs leaves them out), and
# checks that `base-path` is under Astro's `base`.
[consumer]
profile = "astro"
# The site's address, its domain on Netlify. The READMEs, the packages'
# manifests, the binary's help, and site/home/ascribe.toml's `site` phrase
# repeat it, and tests check each against this line; site/home takes it, with
# `trailing-slash` and `permalink-path`, the releases, `[dimensions.pm]`, the
# `version` phrase, and `[sources.code]`, with `[from]`. A pull request's
# preview is built with its own address here and in that phrase
# (.github/workflows/site.yml).
# With it, the build publishes llms.txt and each page's Markdown, for AI
# agents, and `@ascribed/astro` publishes them with the site: `agents` is
# `true` unless it says otherwise.
site = "https://ascribed-dev.com"
# The docs are under /docs/, and the site's own pages, site/home/, at its
# root. The READMEs' links to pages, site/src/site.ts's `docsPath`, and
# .github/workflows/report.yml's `--site` repeat it, and tests check each.
base-path = "/docs/"
trailing-slash = "always"
# Each Markdown version's response headers, `X-Robots-Tag` for a page that
# isn't listed and a canonical `Link` to its page, and the redirects
# ascribe.addresses records, written into the built site's `_headers` and
# `_redirects`, which Netlify reads. site/test/headers.test.ts checks them.
host = "netlify"
# Where each permalink's address is: /go/cli-check/ forwards to the section
# `ascribe check --help` links to. Set from the site's root, so the addresses
# the binary prints don't move when base-path does; crates/ascribe-cli checks
# its help links against it.
permalink-path = "/go/"

# What each kind of AI crawler may do. Docs for a tool are for people to
# find through any assistant, so every kind may read them; `allow` writes no
# lines, and keeps each of them under the lines for every crawler.
[crawlers]
training = "allow"
search = "allow"
on-request = "allow"

[builds.site]
variants = "switch"
availability = "badge"

[editor]
build = "site"

[checks]
# The examples ../ascribe.examples.toml lists say on the page what they were
# tested with. One changed since its last test run is an error here, so the
# docs never publish a tested line that's no longer true; run `ascribe
# observe` in the repository's root and commit what it writes.
example-stale = "error"

# Prose checks through Vale, in the editor, for whoever has Vale 3.16 or
# later installed; `ascribe check --vale` runs them too. Vale isn't needed
# to work on the docs, so without `in-check` a machine without it isn't told
# so.
[checks.vale]
preset = "quiet"

[permalinks.retired]
cli-render = { to = "command/questions.md#cli-resolve", reason = "The command ascribe render was renamed ascribe resolve" }
ASC073 = { to = "content-model/index.md#41-page-types", reason = "model-type-title is gone: every page type has a required string title, declared or not" }
