# The content model for Ascribe's user docs. The pages are in content/.
spec = "0.1"

[project]
content-root = "content"
output-dir = ".ascribe/build"

# Guides are the default; the references and the contracts are `reference`.
[types.guide]
default = true

# Titles can show code ("`ascribe.toml` reference"); the site's layout uses
# the formatted title for the heading and the sidebar.
[types.guide.frontmatter]
title = { type = "string", inline = "code" }
description = { type = "string", role = "description" }

[types.reference]
files = ["reference/**", "contracts/**"]

[types.reference.frontmatter]
title = { type = "string", inline = "code" }
description = { type = "string", role = "description" }
since = "string?"

# What isn't in the latest release is marked with availability. A feature in
# `main` that no release has yet is `@available: next`. When a release ships
# it, `next` below becomes `ascribe <version>`, and every page marked with it
# reads "since <version>". Something that shipped in an earlier release than
# the current one can say so directly: `@available: ascribe 0.1.1`.
[dimensions.release]
label = "Ascribe"
values = ["ascribe"]
labels = { ascribe = "Ascribe" }

# Commands that differ by package manager. The site shows them as tabs, and a
# reader's choice holds on every page.
[dimensions.pm]
label = "Package manager"
values = ["npm", "pnpm"]

[lifecycle.unreleased]
available = true
label = "in main, not yet released"

[features.next]
name = "Ascribe 0.2.0"
available = "ascribe 0.2.0"

[phrases]
# The latest release: the workspace version in Cargo.toml, and every
# package.json under packages/.
version = "0.2.0"
# `engines.node` in package.json. scripts/docs-site/facts.test.ts checks it,
# and every other file that names the Node version.
node = "24"
# The oldest glibc the Linux binaries run on: `GLIBC` in
# .github/workflows/release-build.yml. scripts/docs-site/facts.test.ts checks it.
glibc = "2.28"
# `engines.vscode` in packages/vscode/package.json.
vscode = "1.138"
# The repository. Link to a file as `{repo}/blob/main/<path>`, and to a folder
# as `{repo}/tree/main/<path>`.
repo = "https://github.com/ascribed-dev/ascribe"

[glossary]
match = "first"

[glossary.terms.build]
term = "build"
aliases = ["builds"]
definition = "A named set of choices, in ascribe.toml, for which variants and which availability a page's output keeps."
link = "reference/content-model.md#16-buildsname"
# Also an ordinary word: link the occurrences that mean the term.
match = "marked"

[glossary.terms.variant]
term = "variant"
aliases = ["variants"]
definition = "Alternative content for a value of a dimension, written with @variant."
link = "reference/directives.md#variant"
# Also an ordinary word: link the occurrences that mean the term.
match = "marked"

[glossary.terms.dimension]
term = "dimension"
aliases = ["dimensions"]
definition = "An axis content varies along, such as a package manager or a deployment, declared in ascribe.toml."
link = "reference/content-model.md#6-dimensionsname"

[glossary.terms.fragment]
term = "fragment"
aliases = ["fragments"]
definition = "A source file that exists only to be included in other files: any file with a path segment starting with _."
link = "reference/directives.md#files"

[glossary.terms.phrase]
term = "phrase"
aliases = ["phrases"]
definition = "A reusable string declared in ascribe.toml and written {key} in a page."
link = "reference/directives.md#phrases"
# Also an ordinary word: link the occurrences that mean the term.
match = "marked"

[glossary.terms.content-model]
term = "content model"
aliases = ["content models"]
definition = "A project's schema, ascribe.toml: its content types, dimensions, phrases, and builds."
link = "reference/content-model.md"

[glossary.terms.page-preview]
term = "page preview"
definition = "The editor's preview of the active page, rendered as the site shows it."
link = "guides/editor.md#preview"

[glossary.terms.site-preview]
term = "site preview"
definition = "The active page on the project's own dev server, in the browser or the preview panel."
link = "guides/editor.md#site-preview"

# Where the pages' code examples come from: files in this repository that are
# built, tested, or run, taken with `@snippet`. Netlify builds from a clone of
# the whole repository, so they're there in production too.
# Code examples come from these files. The same folders are listed in three
# other places, which need the same change when `include` changes: the paths
# in .github/workflows/site-npm.yml, the site path pattern in
# .github/workflows/ci.yml, and `ignore` in site/netlify.toml.
# scripts/docs-site/facts.test.ts fails until they agree.
[sources.code]
path = ".."                               # relative to the folder ascribe.toml is in
include = [                               # what's readable; everything else isn't
  ".github/workflows/**",
  "crates/ascribe-cli/tests/output/**",
  "examples/**",
]
ignore = ["**/node_modules/**"]

# How the site in site/ routes. `site`, `base-path`, and `trailing-slash` must
# agree with site/astro.config.mjs; @ascribed/astro checks that they do.
[consumer]
profile = "astro"
# The site's address, its domain on Netlify. astro.config.mjs, the READMEs, the
# extension's manifest, and the binary's help repeat it, and tests check each
# against this line. A pull request's preview is built with its own address
# here and in astro.config.mjs (.github/workflows/site.yml).
site = "https://ascribed-dev.com"
base-path = "/"
trailing-slash = "always"

[builds.site]
variants = "switch"
availability = "badge"

[editor]
build = "site"
