# The content model for the site's own pages: the landing page and, later, the
# pages beside it, outside the docs. The pages are in content/, and the site in
# ../ builds them at its root, with the docs under /docs/ (../astro.config.mjs).
spec = "0.1"

[project]
content-root = "content"
output-dir = ".ascribe/build"

# A page of the site, outside the docs. Its heading is the page's own, in the
# hero, so `title` is for the <title> only.
[types.page.frontmatter]
title = "string"
description = { type = "string", role = "description" }

# A page's opening: its heading and a sentence, drawn by the site's
# stylesheet. `status`, on the landing page, says how far along Ascribe is.
# The landing page's also holds a `@tool-list` and a `@call-to-action`, and
# the mark, a picture for each scheme, which the site sets right of the
# heading where there's room.
[widgets.hero-banner]
description = "A page's opening: its heading and a sentence, and on the landing page how far along Ascribe is, the tools, what to do first, and the mark."
forms = ["container"]
attributes = { status = "enum(early, stable)?" }

# The tools the headline promises, named under it: a list of links, which
# the site draws as a row.
[widgets.tool-list]
description = "The tools the headline promises, named under it as a list of links."
forms = ["container"]

# What a reader does first: the command to install, as a code block or in
# `@steps`, and a paragraph that's only a link, which the site draws as a
# button. In the hero, the two are side by side; in Start, the steps are
# beside what follows them.
[widgets.call-to-action]
description = "What a reader does first: the command to install, then a link to follow, drawn as a button."
forms = ["container"]

# `@story-pillar` under a level-2 heading: the section is one of the story's
# pillars (project-docs/brand/story.md), its heading the claim, which the
# site marks with the gutter's split bar. What proves it follows, in
# `@pillar-proof`s. It's an empty element after the heading, not a container
# around the section: a container would put the variant group in the first
# pillar's example three containers deep.
[widgets.story-pillar]
description = "Marks a section as one of the story's pillars: its heading is the claim, and what proves it follows."
forms = ["line"]
primary = "none"
binding = "heading"

# What proves a pillar: its features or a claim. The `@proof-example` right
# after it is the example that shows it, which the site sets beside it where
# there's room.
[widgets.pillar-proof]
description = "What proves a pillar: its features or a claim, beside the example that follows it."
forms = ["container"]

# The example that shows the `@pillar-proof` before it: a code block read
# from a file, a command's tested output, a screenshot, or a variant group,
# and a sentence under it that says what it is.
[widgets.proof-example]
description = "The example that shows a pillar's proof: a snippet, tested output, a screenshot, or a variant group, and what it is."
forms = ["container"]

# The readers the page speaks to: a heading and a sentence, then an
# `@audience-entry` for each, side by side where there's room.
[widgets.audience-list]
description = "The readers the page speaks to: a heading and a sentence, then an audience for each."
forms = ["container"]

# One reader: who, as a level-3 heading; what leads for them; what they get;
# and last, a paragraph that's only a link to where they start in the docs.
[widgets.audience-entry]
description = "One reader: who they are, what leads for them, what they get, and where they start in the docs."
forms = ["container"]

# The story's quieter pillar, that pages are plain files you can leave, and
# that Ascribe is early and open source: the page's close, each under its
# level-2 heading, side by side on a band.
[widgets.quiet-pillar]
description = "The page's quiet close: plain files you can leave, and that Ascribe is early and open source, side by side."
forms = ["container"]

# A page's source beside what a reader sees. Its content is the source, a
# `@snippet` of the page's file; `page` names that page in ../demo, and the
# site draws its rendered content beside the source (../src/demo.ts).
# test/demo.test.ts fails if the two aren't the same file.
[widgets.source-and-result]
description = "A page's source, as a snippet of its file, beside the page as the site draws it."
forms = ["container"]
attributes = { page = "string" }

# One of the page's claims: its heading and a sentence or two, then the
# smallest example that shows it, which the site sets below them.
[widgets.claim-example]
description = "A claim about Ascribe, then the smallest example that shows it."
forms = ["container"]

# A screenshot is a picture for each scheme, `![…](screenshots/review-light.png){scheme=light}`
# beside its dark one; the site shows the reader's (../src/styles/site.css).
[images.attributes]
scheme = "enum(light, dark)"

# Commands that differ by package manager, as in the docs.
[dimensions.pm]
label = "Package manager"
values = ["npm", "pnpm"]

# What follows are copies of ../../docs/ascribe.toml's, so a claim here is
# marked as the docs mark it. scripts/docs-site/facts.test.ts fails until
# each agrees with the docs': the release dimension, the releases and their
# planned label, the `next` feature, the `version` and `site`
# phrases, the sources, and `[consumer]`'s `site`, `trailing-slash`, and `permalink-path`.
[dimensions.release]
label = "Ascribe"
values = ["ascribe"]
labels = { ascribe = "Ascribe" }

[releases]
planned-label = "in main, not yet released"

[releases.ascribe]
live = ["0.4.1"]
planned = ["0.4.2"]

[releases.ascribe.archived]
"0.3.1" = {}
"0.3.2" = {}
"0.4.0" = {}

[features.next]
name = "In main, not yet released"
available = "ascribe 0.4.2"

[phrases]
version = { line = "ascribe" }
# `[consumer] site`, for links into the docs, which are another project: a
# link that starts with `/` names a file in this one. Write a docs page by its
# permalink, `{site}/go/<name>/`; the site's tests check each name.
site = "https://ascribed-dev.com"
# The release of comrak the parser is forked from, for the credits page. Its
# home is ../../crates/comrak-ascribe/FORK.md, which a page can't read prose
# from: scripts/docs-site/credits.test.ts fails until the two agree.
comrak-release = "v0.55.0"

[sources.code]
path = "../.."                            # relative to the folder ascribe.toml is in
include = [
  ".github/workflows/**",
  "crates/ascribe-cli/tests/output/**",
  "examples/**",
  "packages/astro/starter/**",
  "site/demo/**",
]

# The site's root. A pull request's preview is built with its own address
# here too (.github/workflows/site.yml).
[consumer]
profile = "astro"
site = "https://ascribed-dev.com"
base-path = "/"
trailing-slash = "always"
# The docs publish what agents read; these pages publish nothing for them.
agents = false
permalink-path = "/go/"

[builds.site]
availability = "badge"

[checks]
# The site prints no page's title as a heading: the hero holds the page's
# one level-1 heading.
heading-level-skipped = "off"
# The `next` feature is the docs', copied for marks, and a page uses it only
# while it says something no release has.
feature-unused = "off"
