# The sources fixture's code repository: a scripted change every Monday,
# Wednesday, and Friday, before the docs repository's update runs, for the
# fixture's two-week pass. scripts/sources-fixture/setup.ts copies this file
# into ascribed-dev/sources-fixture-code, with change.ts beside it.
name: Scripted change

on:
  schedule:
    - cron: "0 5 * * 1,3,5"
  workflow_dispatch:
    inputs:
      change:
        description: The change to make
        type: choice
        options: [next, example, unrelated, rename, move, restore]
        default: next

permissions:
  contents: write

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # change.ts counts the changes made before, to choose the next one.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node .github/change.ts "$CHANGE"
        env:
          CHANGE: ${{ inputs.change || 'next' }}
      - run: git push origin HEAD:main
