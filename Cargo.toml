[workspace]
resolver = "3"
members = [
    "crates/comrak-tessera",
    "crates/tessera-core",
    "crates/tessera-syntax",
    "crates/tessera-model",
    "crates/tessera-check",
    "crates/tessera-resolve",
    "crates/tessera-emit",
    "crates/tessera-diff",
    "crates/tessera-sources",
    "crates/tessera-fmt",
    "crates/tessera-lsp",
    "crates/tessera-cli",
    "tests/conformance",
    "tests/commonmark",
    "tests/corpora",
    "tests/corpora/synthetic",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
repository = "https://github.com/ascribed-dev/ascribe"
publish = false

[workspace.dependencies]
# Internal crates. Depend on these with `tessera-core.workspace = true`.
tessera-core = { path = "crates/tessera-core" }
tessera-syntax = { path = "crates/tessera-syntax" }
tessera-model = { path = "crates/tessera-model" }
tessera-check = { path = "crates/tessera-check" }
tessera-resolve = { path = "crates/tessera-resolve" }
tessera-emit = { path = "crates/tessera-emit" }
tessera-diff = { path = "crates/tessera-diff" }
tessera-sources = { path = "crates/tessera-sources" }
tessera-fmt = { path = "crates/tessera-fmt" }
tessera-lsp = { path = "crates/tessera-lsp" }
# The synthetic project the benchmarks share. A dev-dependency only.
tessera-synthetic = { path = "tests/corpora/synthetic" }
# The comrak fork. Depend on it as `comrak-tessera.workspace = true`.
comrak-tessera = { path = "crates/comrak-tessera" }

# External crates shared across the workspace.
ariadne = "0.6"
clap = { version = "4", features = ["derive"] }
# Upstream comrak, only for the CommonMark suite (tests/commonmark), which
# compares the fork against it. The binary renders with the fork.
comrak = { version = "0.55", default-features = false }
insta = { version = "1", features = ["yaml"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = "1.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# Libraries never panic on user input. Tests are
# exempt through clippy.toml; documented invariants use a local `#[allow]`.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
# Stops new long functions; the threshold is in clippy.toml. Functions that
# were already longer allow it by name.
too_many_lines = "warn"

# What ships: the binary in the npm packages and the VS Code extension. Link-time
# optimization across every crate, in one code generation unit, makes it about
# a third smaller on macOS and Linux and a little faster, for about a minute
# more of release build. Debug info is stripped (Cargo's default) and symbols
# kept, so a panic's backtrace names its functions. `panic` stays `unwind`:
# the language server catches a handler's panic and keeps running, and
# `tessera-lsp` won't compile with `abort`. The measurements, and the settings
# not taken, are in tests/corpora/RESULTS.md.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev.package]
# Snapshot diffs are much faster with these optimized.
insta.opt-level = 3
similar.opt-level = 3
