[workspace]
resolver = "3"
members = [
    "crates/comrak-ascribe",
    "crates/ascribe-core",
    "crates/ascribe-syntax",
    "crates/ascribe-model",
    "crates/ascribe-check",
    "crates/ascribe-resolve",
    "crates/ascribe-emit",
    "crates/ascribe-diff",
    "crates/ascribe-sources",
    "crates/ascribe-fmt",
    "crates/ascribe-edit",
    "crates/ascribe-lsp",
    "crates/ascribe-query",
    "crates/ascribe-mcp",
    "crates/ascribe-templates",
    "crates/ascribe-workspace",
    "crates/ascribe-cli",
    "tests/conformance",
    "tests/commonmark",
    "tests/corpora",
    "tests/corpora/synthetic",
]

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
repository = "https://github.com/ascribed-dev/ascribe"
publish = false

[workspace.dependencies]
# Internal crates. Depend on these with `ascribe-core.workspace = true`.
ascribe-core = { path = "crates/ascribe-core" }
ascribe-syntax = { path = "crates/ascribe-syntax" }
ascribe-model = { path = "crates/ascribe-model" }
ascribe-check = { path = "crates/ascribe-check" }
ascribe-resolve = { path = "crates/ascribe-resolve" }
ascribe-emit = { path = "crates/ascribe-emit" }
ascribe-diff = { path = "crates/ascribe-diff" }
ascribe-sources = { path = "crates/ascribe-sources" }
ascribe-fmt = { path = "crates/ascribe-fmt" }
ascribe-edit = { path = "crates/ascribe-edit" }
ascribe-lsp = { path = "crates/ascribe-lsp" }
ascribe-query = { path = "crates/ascribe-query" }
ascribe-mcp = { path = "crates/ascribe-mcp" }
ascribe-templates = { path = "crates/ascribe-templates" }
ascribe-workspace = { path = "crates/ascribe-workspace" }
# The synthetic project the benchmarks share. A dev-dependency only.
ascribe-synthetic = { path = "tests/corpora/synthetic" }
# The comrak fork. Depend on it as `comrak-ascribe.workspace = true`.
comrak-ascribe = { path = "crates/comrak-ascribe" }

# External crates shared across the workspace.
ariadne = "0.6"
clap = { version = "4", features = ["derive"] }
# Upstream comrak, only for the CommonMark suite (tests/commonmark), which
# compares the fork against it. The binary renders with the fork.
comrak = { version = "0.55", default-features = false }
insta = { version = "1", features = ["yaml"] }
proptest = "1"
# JSON Schemas of the JSON the commands and the language server write. Only
# the `json-schema` features and the tests that generate the schemas use it.
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
thiserror = "2"
toml = "1.1"
# Edits `ascribe.toml` in place, keeping its comments: the language server
# finds where a change goes and renders it, never rewriting the file.
toml_edit = "0.25"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# Libraries never panic on user input. Tests are
# exempt through .cargo/clippy.toml; documented invariants use a local `#[allow]`.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
# Stops new long functions; the threshold is in .cargo/clippy.toml. At 150 it
# flagged the worst nine of 3,011 functions when it was turned on, with no
# natural gap lower down (clippy's default, 100, flagged 33). Those nine allow
# it by name, and are split only while being changed for another reason.
too_many_lines = "warn"
# Only the binary prints: a library returns what happened and its caller
# reports it. The crates that print (the CLI, the language server's log, the
# benchmarks and corpus tools) allow these where they do; tests are exempt
# through .cargo/clippy.toml.
print_stdout = "warn"
print_stderr = "warn"
# Tried and not kept:
# - `unreachable_pub` flags only `pub` items other crates can't reach anyway, so
#   `pub(crate)` changes nothing a caller sees, and it misses what it was tried
#   for: public items no other crate uses (#130).
# - `indexing_slicing`: none of a sample of its ~190 hits in library code could
#   panic on input (each is inside a bounds check or indexes data it was built
#   from), and `get` with fallbacks that can't run hides the invariant. Try it
#   again if a fuzz or property test finds an index panic, with
#   `allow-indexing-slicing-in-tests`.

# What ships: the binary in the npm packages and the VS Code extension. Link-time
# optimization across every crate, in one code generation unit, makes it about
# a third smaller on macOS and Linux and a little faster, for about a minute
# more of release build. Debug info is stripped (Cargo's default) and symbols
# kept, so a panic's backtrace names its functions. `panic` stays `unwind`:
# the language server catches a handler's panic and keeps running, and
# `ascribe-lsp` won't compile with `abort`. The measurements, and the settings
# not taken, are in tests/corpora/RESULTS.md.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev.package]
# Snapshot diffs are much faster with these optimized.
insta.opt-level = 3
similar.opt-level = 3
