version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    # html5ever 0.40 needs markup5ever_rcdom 0.40, which upstream hasn't
    # released (crates.io has only 0.39.0+unofficial). Revisit when it does.
    ignore:
      - dependency-name: html5ever
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-dependencies:
        patterns: ["*"]
    # Type packages describe a runtime, so they follow the oldest one Ascribe
    # supports, not the newest release.
    ignore:
      # Node's types stay on the major of `engines.node` in package.json: types
      # for a newer Node would let code use what the supported one doesn't
      # have. Minor and patch updates within that major still come.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # VS Code's types stay at `engines.vscode` in packages/vscode/package.json,
      # which is the oldest VS Code the extension runs in; `vsce` refuses to
      # package an extension whose types are newer. Raise both together, by hand.
      - dependency-name: "@types/vscode"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
