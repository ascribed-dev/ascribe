name: Rust

# Started by ci.yml, which chooses the platforms.
on:
  workflow_call:
    inputs:
      os:
        description: The runners for clippy and the tests, as a JSON list
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With no arguments, rustup installs the toolchain rust-toolchain.toml pins.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  # Advisories, licenses, duplicates, and sources (deny.toml), and unused
  # dependencies. The tools are pinned here, as the actions are.
  dependencies:
    name: cargo deny and cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - run: cargo deny --locked check
      - run: cargo machete

  check:
    name: clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # The sources fixture's pass, on this machine: the update pull request's
      # workflow (examples/docs-repository), run with this build against two
      # local repositories (scripts/sources-fixture/setup.ts).
      - if: runner.os == 'Linux'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - if: runner.os == 'Linux'
        run: node scripts/sources-fixture/setup.ts --local
