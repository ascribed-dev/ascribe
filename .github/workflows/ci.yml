name: CI

# Every check on a pull request and on `main`, started from here so that one
# job, `all checks`, says whether they passed. It's the only check branch
# protection requires: a check that's skipped because nothing it covers
# changed can't be required by name without blocking the merge.
#
# What runs depends on what changed and where:
#
# - A change to plans and reports alone (project-docs/) runs the formatter
#   and nothing else.
# - A pull request runs Linux, and Windows only when the change touches code
#   Windows can break: the file system, path, link, and case handling, the
#   workflows, and the toolchain pins (the `changes` job says which paths).
#   `main` runs Linux and macOS. The rest of the platforms (the Astro
#   end-to-end on arm64, macOS, and Windows) run every night and by hand,
#   here, and the canary's smoke test installs the packed binaries on all four
#   every night too.
# - The docs and the site run when the docs, the site, Ascribe, or a file the
#   docs take code examples from (docs/ascribe.toml's [sources]) changed.
# - The review and drift reports run on their own (review.yml, drift.yml):
#   they report, and don't hold up a merge.
# - A pull request labeled `optimization` also compares every output with its
#   base's (scripts/compare/outputs.ts): a clean-up must change none. Adding
#   or removing a label starts a run, so the label counts as soon as it's
#   added, and stops counting as soon as it's removed. A change to the
#   outputs that a recorded decision (project-docs/decisions/) accepts adds the
#   label `outputs changed` too, and lists the files it accepts in the
#   description (see the job): those still show, but only another difference
#   fails.
# - The install script and the Homebrew formula install the last release, on
#   every night and when either changed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older run of the same kind; the nightly run and a
# push to `main` don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code: ${{ steps.find.outputs.code }}
      site: ${{ steps.find.outputs.site }}
      install: ${{ steps.find.outputs.install }}
      windows: ${{ steps.find.outputs.windows }}
      rust-os: ${{ steps.find.outputs.rust-os }}
      vscode-os: ${{ steps.find.outputs.vscode-os }}
      astro-targets: ${{ steps.find.outputs.astro-targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to compare with the base.
          fetch-depth: 0
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The files this run is about, or `all` when there's no base to compare with.
          files=all
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi

          # Plans and reports are prose nothing builds or tests; only the formatter reads them.
          # The decisions and the change checklists are the exception: tests check them.
          code=true
          if [ "$files" != all ] && [ -n "$files" ] &&
            ! printf '%s\n' "$files" | grep -qvE '^project-docs/' &&
            ! printf '%s\n' "$files" | grep -qE '^project-docs/((decisions|checklists)\.md|decisions/)'; then
            code=false
          fi

          site=false
          if [ "$files" = all ] ||
            printf '%s\n' "$files" | grep -qE '^(docs|site|packages|crates|examples|changes|examples\.observations)/|^(Cargo\.lock|pnpm-lock\.yaml|CHANGELOG\.md|ascribe\.examples\.toml|scripts/release/changes\.ts)$|^\.github/workflows/(ci|site|drift|review|report)\.yml$'; then
            site=true
          fi

          install=false
          if [ "$files" = all ] ||
            printf '%s\n' "$files" | grep -qE '^(site/public/install\.sh|scripts/release/formula\.ts|\.github/workflows/ci\.yml)$'; then
            install=true
          fi

          # Windows is slow, so a pull request runs it only where a change can
          # break on it: the file system, path, link, and case handling in the
          # crates and files below (`ascribe-resolve`'s FileSystem and the code
          # that reads links, canonical paths, drive letters, or a `cfg` for a
          # platform), the VS Code extension's project ownership and the suite
          # that tests it, the workflows, and the toolchain pins. A file that
          # isn't on the list is Linux's to prove on the pull request, and
          # macOS's and Windows's after the merge (nightly). A push and the
          # nightly run don't use this: their platforms are set below.
          windows=false
          if [ "$files" = all ] ||
            printf '%s\n' "$files" | grep -qE '^(crates/(ascribe-(core|resolve|emit|fmt|sources|lsp))/|crates/ascribe-model/src/loader\.rs$|crates/ascribe-check/src/(scope|tool)\.rs$|crates/ascribe-check/src/prose/|crates/ascribe-cli/src/(agents/(checker|hook)|commands/observe)\.rs$|packages/vscode/(src/projects\.ts|test/integration/)|\.github/workflows/|rust-toolchain\.toml$|\.nvmrc$|Cargo\.lock$)'; then
            windows=true
          fi

          linux_x64='{"os":"ubuntu-24.04","target":"linux-x64","env_target":"LINUX_X64","exe":"ascribe"}'
          linux_arm64='{"os":"ubuntu-24.04-arm","target":"linux-arm64","env_target":"LINUX_ARM64","exe":"ascribe"}'
          darwin_arm64='{"os":"macos-latest","target":"darwin-arm64","env_target":"DARWIN_ARM64","exe":"ascribe"}'
          win32_x64='{"os":"windows-latest","target":"win32-x64","env_target":"WIN32_X64","exe":"ascribe.exe"}'
          case "$EVENT" in
            pull_request)
              # Linux always. The VS Code list is empty without Windows, and js.yml
              # skips its job for an empty list, so the matrix never starts empty.
              if [ "$windows" = true ]; then
                rust_os='["ubuntu-latest","windows-latest"]'
                vscode_os='["windows-latest"]'
              else
                rust_os='["ubuntu-latest"]'
                vscode_os='[]'
              fi
              astro="[$linux_x64]"
              ;;
            push)
              rust_os='["ubuntu-latest","macos-latest"]'
              vscode_os='["macos-latest"]'
              astro="[$linux_x64]"
              ;;
            *)
              rust_os='["ubuntu-latest","macos-latest","windows-latest"]'
              vscode_os='["windows-latest","macos-latest"]'
              astro="[$linux_x64,$linux_arm64,$darwin_arm64,$win32_x64]"
              ;;
          esac

          {
            echo "code=$code"
            echo "site=$site"
            echo "install=$install"
            echo "windows=$windows"
            echo "rust-os=$rust_os"
            echo "vscode-os=$vscode_os"
            echo "astro-targets=$astro"
          } | tee -a "$GITHUB_OUTPUT"

  # Plans and reports alone: the formatter is the only check that reads them.
  prose:
    name: format
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/rust.yml
    with:
      os: ${{ needs.changes.outputs.rust-os }}

  js:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/js.yml
    with:
      vscode-os: ${{ needs.changes.outputs.vscode-os }}
      astro-targets: ${{ needs.changes.outputs.astro-targets }}

  site:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/site.yml
    # The pull request's preview is deployed with Netlify's secrets.
    secrets: inherit

  # A clean-up (project-docs/optimization/) changes no output: the base's
  # binary and packages against this pull request's, on every project and the
  # Astro example. Only for pull requests labeled `optimization`.
  compare:
    name: outputs unchanged
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'optimization')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # To read the description's accepted differences.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base, to build it.
          fetch-depth: 2
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The checkout is the merge commit GitHub made; its first parent is the
      # base it was made on. The base branch's tip may have moved on since.
      # With the label `outputs changed`, the differences a decision accepts
      # are listed in the pull request's description, one pattern a line
      # (scripts/compare/outputs.ts --accept), in a block of their own:
      #
      #   ```outputs changed
      #   *: ascribe diff --base HEAD --format html.txt
      #   ```
      #
      # It's read here rather than from the event, so a re-run sees an edit.
      - env:
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'outputs changed') }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          accept=()
          if [ "$ACCEPTED" = true ]; then
            body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body)
            while IFS= read -r pattern; do
              if [ -n "$pattern" ]; then
                accept+=(--accept "$pattern")
              fi
            done < <(printf '%s\n' "$body" | tr -d '\r' |
              awk '/^```outputs changed[[:space:]]*$/ { on = 1; next } on && /^```/ { on = 0 } on')
            if [ "${#accept[@]}" = 0 ]; then
              echo "::error::The pull request is labeled \`outputs changed\`, but its description has no \`\`\`outputs changed block of patterns."
              exit 2
            fi
          fi
          node scripts/compare/outputs.ts --base HEAD^1 --out "$RUNNER_TEMP/compare" "${accept[@]}" |
            tee "$RUNNER_TEMP/compare.txt"
      - if: always()
        run: |
          if [ -f "$RUNNER_TEMP/compare.txt" ]; then
            {
              echo '### Outputs compared with the base'
              echo '```text'
              # The summary's limit is 1 MiB; the job's log has everything.
              head -c 500000 "$RUNNER_TEMP/compare.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The install script (site/public/install.sh) installs the last release on
  # Linux, in a container with no Node and the oldest glibc the binaries run
  # on, and on macOS; and the formula scripts/release/formula.ts writes for it
  # installs it with Homebrew on macOS and Linux, from a tap made here, as
  # `brew install ascribed-dev/tap/ascribe` does from the real one.
  install:
    name: install (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04, brew: true }
          - { target: linux-arm64, os: ubuntu-24.04-arm, brew: false }
          - { target: darwin-arm64, os: macos-latest, brew: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "version=${tag#v}" | tee -a "$GITHUB_OUTPUT"
      # AlmaLinux 8 has glibc 2.28, the floor (GLIBC in release-build.yml), and no Node.
      - name: Install the last release with the script, on glibc 2.28 with no Node
        if: runner.os == 'Linux'
        env:
          IMAGE: almalinux:8@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/site/public:/site:ro" -e VERSION "$IMAGE" sh -euc '
            command -v tar > /dev/null || dnf install -y -q tar gzip
            if command -v node; then echo "node is installed"; exit 1; fi
            sh /site/install.sh
            test "$("$HOME/.local/bin/ascribe" --version)" = "ascribe $VERSION"
          '
      - name: Install the last release with the script
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          sh site/public/install.sh --to "$RUNNER_TEMP/bin"
          test "$("$RUNNER_TEMP/bin/ascribe" --version)" = "ascribe $VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.brew
        with:
          node-version-file: .nvmrc
      - name: Install the last release with Homebrew
        if: matrix.brew
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          if ! command -v brew > /dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap-new --no-git ascribe-ci/tap
          node scripts/release/formula.ts "$VERSION" --out "$(brew --repository ascribe-ci/tap)/Formula/ascribe.rb"
          brew install ascribe-ci/tap/ascribe
          test "$("$(brew --prefix)/bin/ascribe" --version)" = "ascribe $VERSION"
          brew test ascribe-ci/tap/ascribe

  # The one check branch protection requires. It passes when every job above
  # passed or was skipped, and fails when one failed or was cancelled.
  gate:
    name: all checks
    needs: [changes, prose, rust, js, site, compare, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::A check failed or was cancelled."
            exit 1
          fi
