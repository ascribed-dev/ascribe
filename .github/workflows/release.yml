name: Release

# Manual only. A person starts it from the Actions
# tab and picks the version tag under "Use workflow from".
#
# Before anything else, the version job checks that the commit has a passing CI
# run (ci.yml's `all checks`). Without one, a release fails; a dry run only warns.
#
# With `publish` off (the default), it's a dry run: it builds the binary on
# every platform, packs every npm package and extension package, installs
# them on every platform and checks them against examples/quill, and runs the
# publish steps with --dry-run. Nothing leaves the workflow.
#
# With `publish` on, four more jobs follow, in the `release` environment:
# npm (with provenance), the VS Code Marketplace, the GitHub release with the
# binaries, and `tap`, which opens a pull request on the Homebrew tap for a
# person to merge (a dry run writes its formula as an artifact instead). None
# waits for approval: pushing the tag is the sign-off. The environment allows
# only `v*` tags, and a tag ruleset lets only a repository admin create, move,
# or delete one (decision #489).
# The build, pack, and smoke jobs are in release-build.yml, which the nightly
# canary (canary.yml) shares. RELEASING.md is the whole procedure, with its secrets and how to roll back.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm, the VS Code Marketplace, and a GitHub release, and open the Homebrew tap's pull request
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: check the version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The commit's check runs, for the CI check below.
      checks: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: check
        env:
          PUBLISH: ${{ inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=$(node scripts/release/version.ts --check --tag "$REF_NAME")
          elif [ "$PUBLISH" = true ]; then
            echo "::error::Publishing runs from the version tag: pick it under \"Use workflow from\"."
            exit 1
          else
            version=$(node scripts/release/version.ts --check)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A release is only of a commit CI has passed: ci.yml's gate job, `all
      # checks`, is the check run of each commit it ran on. A dry run warns
      # instead, since it publishes nothing and may run from a branch not yet green.
      - name: Check that the commit has a passing CI run
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          SHA: ${{ github.sha }}
        run: |
          runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            -f check_name="all checks" -f per_page=100 \
            --jq '[.check_runs[] | select(.name == "all checks" and .conclusion == "success")] | length')
          if [ "$runs" -gt 0 ]; then
            echo "$SHA has a passing CI run."
            exit 0
          fi
          message="$SHA has no passing CI run (ci.yml's \"all checks\"). Run CI on it (Actions → CI → Run workflow, with this tag selected), then run this again."
          if [ "$PUBLISH" = true ]; then
            echo "::error::$message"
            exit 1
          fi
          echo "::warning::$message A release with publish on would fail here."

  # Build, pack, and smoke-test, shared with the nightly canary.
  build:
    name: build
    needs: version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  npm:
    name: publish to npm
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      # npm trusted publishing and provenance both use the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No registry-url: setup-node would write an `_authToken=${NODE_AUTH_TOKEN}`
      # line, and with the variable unset npm would take it for configured auth and
      # never start the OIDC exchange.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Trusted publishing needs npm 11.5.1 or later. There's no token: npm trades
      # the job's OIDC token for a short-lived publish token, and signs provenance.
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - run: node scripts/release/publish.ts npm

  marketplace:
    name: publish to the VS Code Marketplace
    if: inputs.publish
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      # The login below exchanges the workflow's OIDC token for a Microsoft Entra token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      # Signs in as the managed identity that is a Contributor on the Marketplace
      # publisher. RELEASING.md describes it. No token is stored.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: node scripts/release/publish.ts marketplace

  github:
    name: publish the GitHub release
    if: inputs.publish
    needs: [version, marketplace]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - name: Publish the release, or update its files on a rerun
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/release/version.ts --notes > "$RUNNER_TEMP/notes.md"
          files=(dist/release/github/* dist/release/vsix/* dist/release/SHA256SUMS)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --clobber
            # A draft left by an earlier run is published too.
            gh release edit "v$VERSION" --draft=false
          else
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "v$VERSION" "${files[@]}" --verify-tag \
              --title "Ascribe $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          fi

  # A dry run writes the Homebrew formula from the packed release's SHA256SUMS,
  # as the `formula` artifact, and opens nothing.
  formula:
    name: write the Homebrew formula (dry run)
    if: "!inputs.publish"
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/formula
          node scripts/release/formula.ts "$VERSION" --sums dist/release/SHA256SUMS --out dist/formula/ascribe.rb
          cat dist/formula/ascribe.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: dist/formula
          if-no-files-found: error

  # The last step, once the GitHub release is published: it writes the
  # Homebrew formula from the published release's SHA256SUMS and opens a pull request on ascribed-dev/homebrew-tap, which the maintainer
  # merges. It needs HOMEBREW_TAP_TOKEN on the `release` environment
  # (RELEASING.md); until that exists, it writes the formula and opens nothing.
  # A pre-release (a version with `-`, such as 0.4.0-rc.1) skips it: the tap has
  # one formula, the stable channel, as npm's `latest` and the install script are.
  tap:
    name: open the Homebrew tap's pull request
    if: inputs.publish && !contains(needs.version.outputs.version, '-')
    needs: [version, github]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Write the formula from the published release's SHA256SUMS
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/formula
          node scripts/release/formula.ts "$VERSION" --out dist/formula/ascribe.rb
          cat dist/formula/ascribe.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: dist/formula
          if-no-files-found: error
      - name: Open the pull request on the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAP: ascribed-dev/homebrew-tap
        run: |
          BODY="The formula for [Ascribe $VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION), written from its SHA256SUMS by the release workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Merging it makes \`brew install ascribed-dev/tap/ascribe\` install $VERSION."
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN on the release environment, so this was a dry run: the formula is the \`formula\` artifact, and no pull request was opened."
            exit 0
          fi
          branch="ascribe-$VERSION"
          git clone --quiet "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          pr=$(gh pr list --repo "$TAP" --head "$branch" --state all --json url --jq '.[0].url // empty')
          if [ -n "$pr" ]; then
            echo "The tap already has $VERSION's pull request: $pr"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            # An earlier run pushed the branch but didn't open the pull request.
            gh pr create --repo "$TAP" --head "$branch" --title "ascribe $VERSION" --body "$BODY"
            exit 0
          fi
          git switch --quiet --create "$branch"
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/dist/formula/ascribe.rb" Formula/ascribe.rb
          if git diff --quiet --exit-code -- Formula && [ -z "$(git status --porcelain Formula)" ]; then
            echo "The tap's formula is already $VERSION's."
            exit 0
          fi
          git add Formula/ascribe.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "ascribe $VERSION"
          git push --quiet origin "$branch"
          gh pr create --repo "$TAP" --head "$branch" --title "ascribe $VERSION" --body "$BODY"

  # A release that was publishing and failed opens one issue, or updates the
  # one that's open for this tag. Some packages may already be published by
  # then, which is what the issue tells whoever reads it to check.
  notify:
    name: open an issue for the failure
    needs: [version, build, npm, marketplace, github, formula, tap]
    if: failure() && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Release failed: ${{ github.ref_name }}"
        run: |
          {
            echo "The release of \`$GITHUB_REF_NAME\` failed while publishing."
            echo
            echo "[The run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Failed jobs:"
            echo
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name'
            echo
            echo "Some packages may already be published. Check npm, the Marketplace, and the GitHub release before running this again."
          } > failure.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file failure.md
          else
            gh issue create --title "$TITLE" --body-file failure.md
          fi
