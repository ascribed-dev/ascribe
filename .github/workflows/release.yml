name: Release

# Manual only. A person starts it from the Actions
# tab and picks the version tag under "Use workflow from".
#
# With `publish` off (the default), it's a dry run: it builds the binary on
# every platform, packs every npm package and extension package, installs
# them on every platform and checks them against examples/quill, and runs the
# publish steps with --dry-run. Nothing leaves the workflow.
#
# With `publish` on, four more jobs follow, each waiting for approval in the
# `release` environment: npm (with provenance), the VS Code Marketplace, and a
# draft GitHub release with the binaries. A person publishes the draft, then
# approves the last job, `tap`, which opens a pull request on the Homebrew tap
# (a dry run writes its formula as an artifact instead).
# The build, pack, and smoke jobs are in release-build.yml, which the nightly
# canary (canary.yml) shares. RELEASING.md is the whole procedure, with its secrets and how to roll back.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm, the VS Code Marketplace, and a draft GitHub release (each after approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: check the version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: check
        env:
          PUBLISH: ${{ inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=$(node scripts/release/version.ts --check --tag "$REF_NAME")
          elif [ "$PUBLISH" = true ]; then
            echo "::error::Publishing runs from the version tag: pick it under \"Use workflow from\"."
            exit 1
          else
            version=$(node scripts/release/version.ts --check)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Build, pack, and smoke-test, shared with the nightly canary.
  build:
    name: build
    needs: version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  npm:
    name: publish to npm
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      # npm trusted publishing and provenance both use the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No registry-url: setup-node would write an `_authToken=${NODE_AUTH_TOKEN}`
      # line, and with the variable unset npm would take it for configured auth and
      # never start the OIDC exchange.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Trusted publishing needs npm 11.5.1 or later. There's no token: npm trades
      # the job's OIDC token for a short-lived publish token, and signs provenance.
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - run: node scripts/release/publish.ts npm

  marketplace:
    name: publish to the VS Code Marketplace
    if: inputs.publish
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      # The login below exchanges the workflow's OIDC token for a Microsoft Entra token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      # Signs in as the managed identity that is a Contributor on the Marketplace
      # publisher. RELEASING.md describes it. No token is stored.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: node scripts/release/publish.ts marketplace

  github:
    name: draft the GitHub release
    if: inputs.publish
    needs: [version, marketplace]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - name: Create the draft, or update its files on a rerun
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/release/version.ts --notes > "$RUNNER_TEMP/notes.md"
          files=(dist/release/github/* dist/release/vsix/* dist/release/SHA256SUMS)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --clobber
          else
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "v$VERSION" "${files[@]}" --draft --verify-tag \
              --title "Ascribe $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          fi

  # A dry run writes the Homebrew formula from the packed release's SHA256SUMS,
  # as the `formula` artifact, and opens nothing.
  formula:
    name: write the Homebrew formula (dry run)
    if: "!inputs.publish"
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/formula
          node scripts/release/formula.ts "$VERSION" --sums dist/release/SHA256SUMS --out dist/formula/ascribe.rb
          cat dist/formula/ascribe.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: dist/formula
          if-no-files-found: error

  # The last step, approved once the GitHub release is published, not before:
  # it writes the Homebrew formula from the published release's SHA256SUMS and
  # opens a pull request on ascribed-dev/homebrew-tap, which the maintainer
  # merges. It needs HOMEBREW_TAP_TOKEN on the `release` environment
  # (RELEASING.md); until that exists, it writes the formula and opens nothing.
  # A pre-release (a version with `-`, such as 0.4.0-rc.1) skips it: the tap has
  # one formula, the stable channel, as npm's `latest` and the install script are.
  tap:
    name: open the Homebrew tap's pull request
    if: inputs.publish && !contains(needs.version.outputs.version, '-')
    needs: [version, github]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check that the release is published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # This token can't see a draft at all, so "not found" means a draft too.
          draft=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null || true)
          if [ "$draft" != false ]; then
            echo "::error::v$VERSION is still a draft. Publish the GitHub release, then re-run this job."
            exit 1
          fi
      - name: Write the formula from the published release's SHA256SUMS
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/formula
          node scripts/release/formula.ts "$VERSION" --out dist/formula/ascribe.rb
          cat dist/formula/ascribe.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: dist/formula
          if-no-files-found: error
      - name: Open the pull request on the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAP: ascribed-dev/homebrew-tap
        run: |
          BODY="The formula for [Ascribe $VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION), written from its SHA256SUMS by the release workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Merging it makes \`brew install ascribed-dev/tap/ascribe\` install $VERSION."
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN on the release environment, so this was a dry run: the formula is the \`formula\` artifact, and no pull request was opened."
            exit 0
          fi
          branch="ascribe-$VERSION"
          git clone --quiet "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          pr=$(gh pr list --repo "$TAP" --head "$branch" --state all --json url --jq '.[0].url // empty')
          if [ -n "$pr" ]; then
            echo "The tap already has $VERSION's pull request: $pr"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            # An earlier run pushed the branch but didn't open the pull request.
            gh pr create --repo "$TAP" --head "$branch" --title "ascribe $VERSION" --body "$BODY"
            exit 0
          fi
          git switch --quiet --create "$branch"
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/dist/formula/ascribe.rb" Formula/ascribe.rb
          if git diff --quiet --exit-code -- Formula && [ -z "$(git status --porcelain Formula)" ]; then
            echo "The tap's formula is already $VERSION's."
            exit 0
          fi
          git add Formula/ascribe.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "ascribe $VERSION"
          git push --quiet origin "$branch"
          gh pr create --repo "$TAP" --head "$branch" --title "ascribe $VERSION" --body "$BODY"
