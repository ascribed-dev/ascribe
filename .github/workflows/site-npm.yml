name: Site from npm

# The docs site built the way production builds it: `docs/` and `site/` alone,
# copied out of the checkout, with Ascribe from npm (`npm ci`, then the newest
# canary with `npm run follow-next`), no workspace install and no
# ASCRIBE_BIN. It runs after each canary and when `main` changes the docs or
# the site, and reports; it doesn't run on pull requests, since a pull request
# may use a feature no canary has yet. The Site workflow builds pull requests
# with their own Ascribe.

on:
  workflow_run:
    workflows: [Canary]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/site-npm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test site/ from npm
    # After a canary, only one that passed: a failed one published nothing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.nvmrc
      - name: Copy docs/ and site/ alone
        run: |
          mkdir "$RUNNER_TEMP/alone"
          cp -R docs site "$RUNNER_TEMP/alone/"
          echo "SITE_DIR=$RUNNER_TEMP/alone/site" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: ${{ env.SITE_DIR }}
      - run: npm run follow-next
        working-directory: ${{ env.SITE_DIR }}
      - run: npm run build
        working-directory: ${{ env.SITE_DIR }}
      - run: npx playwright-core install --with-deps chromium
        working-directory: ${{ env.SITE_DIR }}
      - run: npm test
        working-directory: ${{ env.SITE_DIR }}
