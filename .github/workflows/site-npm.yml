name: Site from npm

# The docs site built the way production builds it: the repository's files
# alone, as Netlify's clone has them, with no `git` history, Ascribe from npm
# (`npm ci`, then the newest canary with `npm run follow-next`), no workspace
# install, and no ASCRIBE_BIN. It runs after each canary and when `main`
# changes the site, the docs, or a file the docs take code examples from, and
# reports; it doesn't run on pull requests, since a pull request may use a
# feature no canary has yet. CI's site job (site.yml) builds pull requests with
# their own Ascribe.
#
# A push can still document something the canary doesn't have yet. When the
# check fails and the canary lacks what the commit ships, the job says it's
# waiting for a canary, with a link to start one, and passes: the run after
# that canary is the real check. A failure with a canary that has the commit
# stays red (scripts/release/canary.ts).

on:
  workflow_run:
    workflows: [Canary]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      # Where the docs' code examples come from: `[sources.code] include` in
      # docs/ascribe.toml.
      - "examples/**"
      - ".github/workflows/**"
      - "crates/ascribe-cli/tests/output/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test site/ from npm
    # After a canary, only one that passed: a failed one published nothing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to compare with the canary's commit if it fails.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
      # The pages take code examples from files outside docs/, so the whole
      # tree is copied, as committed: nothing built or installed, and no
      # `.git`, since `ascribe build` needs none.
      - name: Copy the repository's files alone
        run: |
          mkdir "$RUNNER_TEMP/alone"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/alone"
          echo "SITE_DIR=$RUNNER_TEMP/alone/site" >> "$GITHUB_ENV"
      # Each step below goes on only if the one before it passed, and a
      # failure is judged by the last step: real, or waiting for a canary.
      - id: install
        run: npm ci
        working-directory: ${{ env.SITE_DIR }}
        continue-on-error: true
      - id: follow
        if: steps.install.outcome == 'success'
        run: npm run follow-next
        working-directory: ${{ env.SITE_DIR }}
        continue-on-error: true
      - id: build
        if: steps.follow.outcome == 'success'
        run: npm run build
        working-directory: ${{ env.SITE_DIR }}
        continue-on-error: true
      - id: browser
        if: steps.build.outcome == 'success'
        run: npx playwright-core install --with-deps chromium
        timeout-minutes: 5
        working-directory: ${{ env.SITE_DIR }}
        continue-on-error: true
      - id: test
        if: steps.browser.outcome == 'success'
        run: npm test
        working-directory: ${{ env.SITE_DIR }}
        continue-on-error: true
      - name: Fail, unless it waits for a canary
        if: steps.test.outcome != 'success'
        run: node scripts/release/canary.ts failed
