name: Board

# Reads the project board (github.com/orgs/ascribed-dev/projects/1) and, when
# asked, moves issues or pull requests on it, for agents that can't reach the
# board themselves. A Claude cloud session can use this repository's REST API
# but not GitHub's GraphQL API or the organization's, and the board is only
# reachable through those; a workflow can, with a token that has the board.
#
# Run it from Actions → Board → Run workflow, or with
# `gh workflow run board.yml --ref main -f issue="123 124" -f status="Ready"`, which
# gives every issue listed the one Status. With no issue it only reads, and
# writes the board, its fields, and its items to `board.json` on the branch
# `board`, one commit per change, which an agent reads through the
# repository's contents API; the branch's history is the board's. After a move
# it reads only with `-f read=true`. Nothing else runs on a push to `board`.
#
# Every call to the board is GraphQL, against the token's hourly limit, and a
# read lists the whole board. So one run moves several cards, and a move doesn't
# read the board unless asked: on 11 October 2026 triage's thirty moves, each
# followed by a read, ran into the limit.
#
# The token is the secret PROJECT_BOARD_TOKEN: a fine-grained token owned by
# `ascribed-dev` with Organization → Projects: read and write. The job's own
# token can't reach an organization's projects. project-docs/outside.md lists
# it.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue or pull request numbers in this repository to move, separated by spaces or commas, each added to the board if it isn't there; empty to only read
        type: string
        default: ""
      status:
        description: The Status to give them, by the option's name, as the board shows it
        type: string
        default: ""
      read:
        description: After a move, also read the board into board.json; a run with no issue always reads
        type: boolean
        default: false

permissions:
  # To push `board`, and to find an issue's URL.
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: board
  cancel-in-progress: false

env:
  OWNER: ascribed-dev
  NUMBER: "1"

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Move the issues
        if: inputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
          ISSUES: ${{ inputs.issue }}
          STATUS: ${{ inputs.status }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          read -ra issues <<< "${ISSUES//,/ }"
          [ ${#issues[@]} -gt 0 ] || { echo "::error::No issue number in '$ISSUES'."; exit 1; }
          for issue in "${issues[@]}"; do
            [[ $issue =~ ^[0-9]+$ ]] || { echo "::error::'$issue' isn't an issue number."; exit 1; }
          done
          [ -n "$STATUS" ] || { echo "::error::No status to give ${issues[*]/#/#}."; exit 1; }
          # The project and its Status field once, for every issue.
          project=$(gh project view "$NUMBER" --owner "$OWNER" --format json --jq .id)
          gh project field-list "$NUMBER" --owner "$OWNER" --format json > fields.json
          field=$(jq -r '.fields[] | select(.name == "Status") | .id' fields.json)
          option=$(jq -r --arg s "$STATUS" '.fields[] | select(.name == "Status") | .options[] | select(.name == $s) | .id' fields.json)
          if [ -z "$option" ]; then
            echo "::error::The board has no Status '$STATUS'. It has: $(jq -r '[.fields[] | select(.name == "Status") | .options[].name] | join(", ")' fields.json)."
            exit 1
          fi
          for issue in "${issues[@]}"; do
            # Its own URL, /issues/ or /pull/; item-add returns the existing item
            # when it's on the board already.
            url=$(GH_TOKEN=$REPO_TOKEN gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq .html_url)
            item=$(gh project item-add "$NUMBER" --owner "$OWNER" --url "$url" --format json --jq .id)
            gh project item-edit --project-id "$project" --id "$item" \
              --field-id "$field" --single-select-option-id "$option"
            echo "Moved #$issue to $STATUS." >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Read the board
        if: inputs.issue == '' || inputs.read
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
        run: |
          gh project view "$NUMBER" --owner "$OWNER" --format json > project.json
          gh project field-list "$NUMBER" --owner "$OWNER" --format json --limit 100 > fields.json
          gh project item-list "$NUMBER" --owner "$OWNER" --format json --limit 1000 > items.json
          # Sorted, so the branch's diffs show what moved and nothing else.
          jq -n --slurpfile p project.json --slurpfile f fields.json --slurpfile i items.json '{
            project: ($p[0] | {id, number, title, url, shortDescription}),
            fields: ($f[0].fields | sort_by(.name)),
            items: ($i[0].items | sort_by(.content.repository // "", .content.number // 0, .id))
          }' > board.json
          echo "$(jq '.items | length' board.json) items on the board." >> "$GITHUB_STEP_SUMMARY"

      - name: Write board.json to the branch
        if: inputs.issue == '' || inputs.read
        env:
          TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git init -q -b board snapshot
          cd snapshot
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          # The branch starts with the first run; after that, each run builds on it.
          if git -c http.extraheader="$auth" fetch -q --depth 1 origin board; then
            git checkout -q -B board FETCH_HEAD
          fi
          cp ../board.json .
          git add board.json
          if git diff --cached --quiet && git rev-parse -q --verify HEAD > /dev/null; then
            echo "The board hasn't changed since the last run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "The board, from $RUN"
          git -c http.extraheader="$auth" push -q origin board
