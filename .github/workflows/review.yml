name: Review

# The review report: on each pull request, every page the change reaches,
# rendered with its changes marked, as one HTML file a reviewer opens from the
# run's summary. It's the job docs/content/guides/review.md ("The report in
# CI") gives users, run as written, with Ascribe from npm. It installs `next`,
# the canary of `main`, where the guide installs the latest release, since
# this repository's projects follow `main`. Two projects: examples/quill on
# every pull request, and docs when the pull request changes it.

# Started by ci.yml, on pull requests.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  report:
    name: review report (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: examples/quill
            report: quill-review.html
          - project: docs
            report: docs-review.html
            only-when-changed: true
    env:
      PROJECT: ${{ matrix.project }}
      REPORT: ${{ matrix.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so `ascribe diff` finds where the branch left
          # its base.
          fetch-depth: 0
      - id: changed
        name: Look for changes to the project
        env:
          ONLY_WHEN_CHANGED: ${{ matrix.only-when-changed }}
        run: |
          if [ "$ONLY_WHEN_CHANGED" = true ] && git diff --quiet "origin/$GITHUB_BASE_REF...HEAD" -- "$PROJECT"; then
            echo "::notice::The pull request doesn't change $PROJECT, so there's no report for it."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - if: steps.changed.outputs.changed == 'true'
        run: npm install --global @ascribed/cli@next
      - name: Write the report
        if: steps.changed.outputs.changed == 'true'
        run: >
          ascribe diff --config "$PROJECT"
          --base "origin/$GITHUB_BASE_REF" --format html > "$REPORT"
      - id: upload
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.report }}
          path: ${{ matrix.report }}
          # One file, not zipped, so it opens in the browser.
          archive: false
          if-no-files-found: error
      - name: Link the report from the summary
        if: steps.changed.outputs.changed == 'true'
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Review report: $PROJECT"
            echo
            ascribe --version | sed 's/^/    /'
            ascribe diff --config "$PROJECT" --base "origin/$GITHUB_BASE_REF" | sed 's/^/    /'
            echo
            echo "[Open the review report]($URL): every changed page of $PROJECT, rendered with its changes marked."
          } >> "$GITHUB_STEP_SUMMARY"
