name: Canary

# Publishes the npm packages from `main` every night under the `next` tag, with
# nobody approving it, and on demand: Actions → Canary → Run workflow, from
# `main`. Releases (release.yml) are separate, approved, and keep `latest`.
#
# A canary is `<next>-next.<run number>`, stamped in the checkout and never
# committed; each package's `gitHead`, and `ascribe --version`, name its
# commit. A night when nothing that ships has changed since the last canary
# publishes nothing, and passes. A canary whose build or smoke test fails
# publishes nothing, so `next` stays on the newest canary that passed. Every
# package is published under `next-pending` first, and `next` moves only when
# all of them are on npm.
# RELEASING.md describes it, and how to deprecate a bad one.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if nothing that ships has changed since the last canary
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  version:
    name: stamp the version
    # By hand, it runs from `main` only; the `canary` environment enforces it too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to compare with the last canary's commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The last canary's commit is its `gitHead` on npm. Without one (no canary
      # yet, or a commit no longer on `main`), the canary is published.
      - id: changes
        name: Compare with the last canary
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last=$(npm view @ascribed/cli@next gitHead 2>/dev/null || true)
          # It comes from the registry: only a commit hash goes on to `git`.
          [[ $last =~ ^[0-9a-f]{40}$ ]] || last=
          # What ships; the checks that run Ascribe from npm use the same list.
          mapfile -t shipping < <(node scripts/release/canary.ts paths)
          [ ${#shipping[@]} -gt 0 ] || { echo "::error::No list of what ships."; exit 1; }
          if [ "$FORCE" = true ]; then
            changed=true
          elif [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2> /dev/null; then
            echo "No earlier canary's commit to compare with (\`next\` has gitHead '$last')."
            changed=true
          elif git diff --quiet "$last" HEAD -- "${shipping[@]}"; then
            echo "::notice::Nothing that ships has changed since the last canary ($last). Publishing nothing."
            changed=false
          else
            git diff --stat "$last" HEAD -- "${shipping[@]}"
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - id: stamp
        if: steps.changes.outputs.changed == 'true'
        run: echo "version=$(node scripts/release/version.ts --canary "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      canary: ${{ github.run_number }}

  npm:
    name: publish to npm under next
    needs: [version, build]
    runs-on: ubuntu-latest
    # Limited to `main`, with no reviewers: the canary is unattended.
    environment: canary
    permissions:
      contents: read
      # npm trusted publishing and provenance both use the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No registry-url, as in release.yml: it would stop npm's OIDC exchange.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Moving a dist-tag through trusted publishing needs npm 11.21.0 or later.
      - run: npm install --global npm@^11.21.0
      - name: Stamp the canary's version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: test "$(node scripts/release/version.ts --canary "$GITHUB_RUN_NUMBER")" = "$VERSION"
      # A package npm has never had can't have a trusted publisher yet, so its
      # first version is published by hand. Say so, rather than fail on npm's
      # authentication error partway through.
      - name: Check that every package is on npm
        run: |
          missing=$(node scripts/release/publish.ts missing)
          if [ -n "$missing" ]; then
            echo "::error::Not on npm yet, so no trusted publisher: $missing. Publish its first version by hand (RELEASING.md, the nightly canary's setup), then re-run this job."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist/release
      # Everything goes under a holding tag first, and `next` moves only once every
      # package is on npm, so `next` never names two canaries. A run that fails
      # partway can be re-run: it skips what's published, and then moves `next`.
      - run: node scripts/release/publish.ts npm --tag next-pending
      - run: node scripts/release/publish.ts tag next

  # Tells Netlify to rebuild the docs site, which installs the canary `next`
  # now names (site/netlify.toml). The site's build hook is the SITE_BUILD_HOOK
  # secret; without it, this says so and passes. A night that published
  # nothing rebuilds nothing.
  site:
    name: rebuild the docs site
    needs: [version, npm]
    runs-on: ubuntu-latest
    env:
      SITE_BUILD_HOOK: ${{ secrets.SITE_BUILD_HOOK }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - if: env.SITE_BUILD_HOOK == ''
        run: echo "::notice::No SITE_BUILD_HOOK secret; the site isn't told to rebuild."
      # The title names the canary in the site's list of deploys.
      - if: env.SITE_BUILD_HOOK != ''
        run: >
          curl --fail --silent --show-error --request POST --data '{}'
          "$SITE_BUILD_HOOK?trigger_title=canary+$VERSION"
