name: Canary

# Publishes the npm packages from `main` every night under the `next` tag, with
# nobody approving it, and on demand: Actions → Canary → Run workflow, from
# `main`. Releases (release.yml) are separate, approved, and keep `latest`.
#
# A canary is `<next>-next.<run number>`, stamped in the checkout and never
# committed; each package's `gitHead`, and `ascribe --version`, name its
# commit. A night when nothing that ships has changed since the last canary
# publishes nothing, and passes. A canary whose build, smoke test, or test
# suites (the Rust workspace on Linux and Windows, and the JavaScript tests)
# fail publishes nothing, so `next` stays on the newest canary that passed. Every
# package is published under `next-pending` first, and `next` moves only when all
# of them are on npm. A night when npm is slow to show one leaves `next` where it
# was, on every package, and passes; the next run's `catch-up` moves it, as does
# running this by hand.
# RELEASING.md describes it, and how to deprecate a bad one.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if nothing that ships has changed since the last canary
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  # Moves `next` to the canary an earlier run left under `next-pending`, when
  # npm now shows every package of it (scripts/release/publish.ts). It runs
  # first, so the comparison below is with that canary.
  catch-up:
    name: catch up next
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: canary
    permissions:
      contents: read
      # Moving a dist-tag through trusted publishing uses the job's OIDC token.
      id-token: write
    outputs:
      moved: ${{ steps.catch-up.outputs.moved }}
      version: ${{ steps.catch-up.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Moving a dist-tag through trusted publishing needs npm 11.21.0 or later.
      - run: npm install --global npm@^11.21.0
      - id: catch-up
        run: node scripts/release/publish.ts catch-up next-pending next

  version:
    name: stamp the version
    needs: catch-up
    # By hand, it runs from `main` only; the `canary` environment enforces it too.
    # A catch-up that failed doesn't stop the night's canary.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to compare with the last canary's commit.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The last canary's commit is its `gitHead` on npm. Without one (no canary
      # yet, or a commit no longer on `main`), the canary is published.
      - id: changes
        name: Compare with the last canary
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last=$(npm view @ascribed/cli@next gitHead 2>/dev/null || true)
          # It comes from the registry: only a commit hash goes on to `git`.
          [[ $last =~ ^[0-9a-f]{40}$ ]] || last=
          # What ships; the checks that run Ascribe from npm use the same list.
          mapfile -t shipping < <(node scripts/release/canary.ts paths)
          [ ${#shipping[@]} -gt 0 ] || { echo "::error::No list of what ships."; exit 1; }
          if [ "$FORCE" = true ]; then
            changed=true
          elif [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2> /dev/null; then
            echo "No earlier canary's commit to compare with (\`next\` has gitHead '$last')."
            changed=true
          elif git diff --quiet "$last" HEAD -- "${shipping[@]}"; then
            echo "::notice::Nothing that ships has changed since the last canary ($last). Publishing nothing."
            changed=false
          else
            git diff --stat "$last" HEAD -- "${shipping[@]}"
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - id: stamp
        if: steps.changes.outputs.changed == 'true'
        run: echo "version=$(node scripts/release/version.ts --canary "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      canary: ${{ github.run_number }}

  # The test suites on the commit being published, as rust.yml and js.yml run
  # them. They run beside the build, and the npm job waits for both.
  rust-tests:
    name: cargo test (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With no arguments, rustup installs the toolchain rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Vale, for crates/ascribe-report/tests/all/vale.rs, which fails on Linux without
      # one. The same pinned release and checksum as rust.yml.
      - if: runner.os == 'Linux'
        name: Install Vale
        run: |
          version=3.24.0
          sum=867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
          archive="vale_${version}_Linux_64-bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/vale-cli/vale/releases/download/v${version}/${archive}"
          echo "$sum  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/vale" vale
          echo "ASCRIBE_TEST_VALE=$RUNNER_TEMP/vale/vale" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked

  js-tests:
    name: JavaScript tests
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The same container as js.yml, for the same reason: the element library's
    # tests drive browsers, and its image has them. Its tag is the playwright-core
    # version in pnpm-lock.yaml (scripts/ci/workflows.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    env:
      # The job runs as root, and Firefox won't start under a home directory
      # another user owns, which is what Actions gives a container.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout belongs to the runner's user and the job runs as root,
      # which git refuses unless told to trust it. Tests run `git ls-files`.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Astro and VS Code resolve declarations from these builds, as js.yml's check job does.
      - run: pnpm --filter @ascribed/cli build
      - run: pnpm --filter @ascribed/elements build
      - run: pnpm test

  npm:
    name: publish to npm under next
    needs: [version, build, rust-tests, js-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Limited to `main`, with no reviewers: the canary is unattended.
    environment: canary
    outputs:
      moved: ${{ steps.tag.outputs.moved }}
    permissions:
      contents: read
      # npm trusted publishing and provenance both use the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No registry-url, as in release.yml: it would stop npm's OIDC exchange.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Moving a dist-tag through trusted publishing needs npm 11.21.0 or later.
      - run: npm install --global npm@^11.21.0
      - name: Stamp the canary's version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: test "$(node scripts/release/version.ts --canary "$GITHUB_RUN_NUMBER")" = "$VERSION"
      # A package npm has never had can't have a trusted publisher yet, so its
      # first version is published by hand. Say so, rather than fail on npm's
      # authentication error partway through.
      - name: Check that every package is on npm
        run: |
          missing=$(node scripts/release/publish.ts missing)
          if [ -n "$missing" ]; then
            echo "::error::Not on npm yet, so no trusted publisher: $missing. Publish its first version by hand (RELEASING.md, the nightly canary's setup), then re-run this job."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      # Everything goes under a holding tag first, and `next` moves only once every
      # package is on npm, so `next` never names two canaries. A run that fails
      # partway can be re-run: it skips what's published, and then moves `next`.
      # When npm is still missing a package after the wait, `next` stays on
      # every package and this passes with a warning; a later run catches up.
      - run: node scripts/release/publish.ts npm --tag next-pending
      - id: tag
        run: node scripts/release/publish.ts tag next

  # Tells Netlify to rebuild the docs site, which installs the canary `next`
  # now names (site/netlify.toml). The site's build hook is the SITE_BUILD_HOOK
  # secret; without it, this says so and passes. A night that moved `next`
  # nowhere rebuilds nothing.
  site:
    name: rebuild the docs site
    needs: [catch-up, version, npm]
    if: >-
      !cancelled() &&
      (needs.npm.outputs.moved == 'true' || needs.catch-up.outputs.moved == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_BUILD_HOOK: ${{ secrets.SITE_BUILD_HOOK }}
      # The canary `next` now names: tonight's, or the one catch-up moved it to.
      VERSION: ${{ needs.npm.outputs.moved == 'true' && needs.version.outputs.version || needs.catch-up.outputs.version }}
    steps:
      - if: env.SITE_BUILD_HOOK == ''
        run: echo "::notice::No SITE_BUILD_HOOK secret; the site isn't told to rebuild."
      # The title names the canary in the site's list of deploys.
      - if: env.SITE_BUILD_HOOK != ''
        run: >
          curl --fail --silent --show-error --request POST --data '{}'
          "$SITE_BUILD_HOOK?trigger_title=canary+$VERSION"

  # A night that fails opens one issue, or updates the one that's open, so a
  # broken canary is seen by whoever reads the repository's issues and not only
  # by whoever opens the Actions tab. Close the issue once a later night passes.
  notify:
    name: open an issue for the failure
    needs: [catch-up, version, build, rust-tests, js-tests, npm, site]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Canary failed
        run: |
          {
            echo "The nightly canary failed, so \`next\` stays on the newest canary that passed."
            echo
            echo "[The run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) on \`$GITHUB_SHA\`. Failed jobs:"
            echo
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name'
          } > failure.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file failure.md
          else
            gh issue create --title "$TITLE" --body-file failure.md
          fi
