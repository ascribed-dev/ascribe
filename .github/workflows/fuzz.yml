# Fuzzes the parser, the content model's loader, the formatter, the
# frontmatter reader, the OpenAPI reader, and the JSON example validator each
# night (fuzz/, CONTRIBUTING.md's "Fuzzing"), a few minutes a target. It needs
# a nightly toolchain, the dated one fuzz/rust-toolchain.toml pins, and runs
# on a schedule only, never on a pull request (decision #1020).
#
# Each target's corpus is kept with actions/cache, restored and saved even
# when the run crashes, and seeded with the conformance cases each night
# (fuzz/seed.sh), so an eviction costs a few nights of growth and nothing
# else. When a target crashes, it opens one issue per distinct crash, keyed
# by the crash's stack signature (fuzz/signature.sh), with the input that
# crashed; a crash with an issue still open comments on it instead, and the
# run fails.
name: Fuzz

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ: "0.13.2"

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [parse, model, format, frontmatter, openapi, example]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With no arguments, in fuzz/, rustup installs the nightly fuzz/rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install "cargo-fuzz@$CARGO_FUZZ" --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - run: ./seed.sh
      - name: Fuzz
        id: fuzz
        continue-on-error: true
        run: >
          cargo fuzz run ${{ matrix.target }} --
          -max_total_time=300 -max_len=4096 -timeout=10
          2>&1 | tee "$RUNNER_TEMP/fuzz.log"; exit "${PIPESTATUS[0]}"
        shell: bash
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fuzz.outcome != 'success'
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
      - name: Open or comment on the issue
        if: steps.fuzz.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/fuzz.log"
          signature=$(./signature.sh "$log")
          id=$(printf '%s\n' "$signature" | sha256sum | cut -c1-12)
          input=$(ls -t "artifacts/$TARGET"/* 2>/dev/null | head -n 1 || true)
          {
            echo "The nightly fuzz run of \`$TARGET\` failed. [The run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) keeps the input as the artifact \`fuzz-$TARGET\` for 30 days."
            echo
            echo "**Signature** \`$id\`:"
            echo
            echo '```text'
            echo "$signature"
            echo '```'
            if [ -n "$input" ]; then
              echo
              echo "**Input** (\`$(basename "$input")\`, $(wc -c < "$input") bytes), as the target reads it:"
              echo
              echo '```text'
              cargo fuzz fmt "$TARGET" "$input" 2>&1 | sed '1,/^Output of/d' | sed '/./,$!d' | head -c 4000 || true
              echo
              echo '```'
              echo
              echo 'In base64, to reproduce with `base64 -d > crash && cargo fuzz run '"$TARGET"' crash` in `fuzz/`:'
              echo
              echo '```text'
              base64 -w 0 "$input" | head -c 8000 || true
              echo
              echo '```'
            fi
            echo
            echo '<details><summary>What the run printed: the panic, or the end of the log</summary>'
            echo
            echo '```text'
            if grep -q 'panicked at' "$log"; then
              sed -n '/panicked at/,/^stack backtrace/p' "$log" | head -n 60 || true
            else
              tail -n 60 "$log"
            fi
            echo '```'
            echo
            echo '</details>'
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --state open --search "in:title \"$id\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --label rust --title "Fuzz: $TARGET crashes ($id)" --body-file "$RUNNER_TEMP/issue.md"
          fi
          exit 1
