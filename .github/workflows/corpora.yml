name: Corpora and performance

# Weekly, and by hand from the Actions tab. It fetches three
# documentation repositories, runs the recognition and conversion checks over
# them, times the benchmarks, and fails when a metric is over its recorded
# baseline by the margin in tests/corpora/baselines/perf.json (3x plus 25 ms; see
# tests/corpora/RESULTS.md for why) or over one of the spec's targets. The
# page bench holds its own criterion: it fails when a cursor move costs This
# page more than it cost Used by. So does the keystroke bench: it fails when a
# file no page reads costs more than a tenth of what a page written on disk does.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      record:
        description: "Record the results as new baselines (download perf.json from the run's artifacts and commit it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A corpus that can't be fetched is a failure here, not a skip.
  ASCRIBE_CORPORA: require

jobs:
  corpora:
    name: corpora and performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Peak memory is read through /usr/bin/time (GNU time on Linux).
      - name: Install time
        run: "[ -x /usr/bin/time ] || { sudo apt-get update && sudo apt-get install -y time; }"
      - name: Build the command
        run: cargo build --release -p ascribe-cli -p ascribe-corpora
      - name: Recognition and conversion checks over the corpora
        run: cargo test --release -p ascribe-corpora -- --include-ignored --nocapture
      - name: Benchmarks
        env:
          ASCRIBE_BENCH_OUT: ${{ github.workspace }}/bench-results.jsonl
        run: |
          rm -f "$ASCRIBE_BENCH_OUT"
          cargo bench -p ascribe-corpora --bench perf
          cargo bench -p ascribe-lsp --bench keystroke
          cargo bench -p ascribe-resolve --bench incremental
          cargo bench -p ascribe-lsp --bench completion
          cargo bench -p ascribe-lsp --bench page
          cargo bench -p ascribe-lsp --bench search
      - name: Compare with the recorded baselines
        if: ${{ !inputs.record }}
        run: ./target/release/corpora compare bench-results.jsonl
      - name: Record the results as the baselines
        if: ${{ inputs.record }}
        run: |
          ./target/release/corpora compare bench-results.jsonl --record
          cat tests/corpora/baselines/perf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.record }}
        with:
          name: perf-baseline
          path: tests/corpora/baselines/perf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: bench-results.jsonl
