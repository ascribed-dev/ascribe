name: Corpora and performance

# Weekly, and by hand from the Actions tab. It fetches three
# documentation repositories, runs the recognition and conversion checks over
# them, times the benchmarks, and fails when a metric is over its recorded
# baseline by the margin in tests/corpora/baselines/perf.json (3x plus 25 ms; see
# tests/corpora/RESULTS.md for why) or over one of the spec's targets.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      record:
        description: "Record the results as new baselines (download perf.json from the run's artifacts and commit it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A corpus that can't be fetched is a failure here, not a skip.
  ASCRIBE_CORPORA: require

jobs:
  corpora:
    name: corpora and performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Peak memory is read through /usr/bin/time (GNU time on Linux).
      - name: Install time
        run: "[ -x /usr/bin/time ] || { sudo apt-get update && sudo apt-get install -y time; }"
      - name: Build the command
        run: cargo build --release -p tessera-cli -p tessera-corpora
      - name: Recognition and conversion checks over the corpora
        run: cargo test --release -p tessera-corpora -- --include-ignored --nocapture
      - name: Benchmarks
        env:
          ASCRIBE_BENCH_OUT: ${{ github.workspace }}/bench-results.jsonl
        run: |
          rm -f "$ASCRIBE_BENCH_OUT"
          cargo bench -p tessera-corpora --bench perf
          cargo bench -p tessera-lsp --bench keystroke
          cargo bench -p tessera-resolve --bench incremental
          cargo bench -p tessera-lsp --bench completion
      - name: Compare with the recorded baselines
        if: ${{ !inputs.record }}
        run: ./target/release/corpora compare bench-results.jsonl
      - name: Record the results as the baselines
        if: ${{ inputs.record }}
        run: |
          ./target/release/corpora compare bench-results.jsonl --record
          cat tests/corpora/baselines/perf.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.record }}
        with:
          name: perf-baseline
          path: tests/corpora/baselines/perf.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-results
          path: bench-results.jsonl
