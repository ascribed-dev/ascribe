name: JavaScript

# Automatic runs (pull requests, pushes to main) are off to save Actions
# minutes. Run it by hand from the Actions tab ("Run workflow"), and
# restore the pull_request and push triggers to turn automatic runs back on.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version named in package.json's `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The element library's tests drive Chromium, Firefox, and WebKit.
      - run: pnpm --filter @tessera/elements exec playwright-core install --with-deps chromium firefox webkit
      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
