name: JavaScript

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm version named in package.json's `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The element library's tests drive Chromium, Firefox, and WebKit.
      - run: pnpm --filter @ascribed/elements exec playwright-core install --with-deps chromium firefox webkit
      - run: pnpm format:check
      - run: pnpm lint
      # Astro and VS Code resolve declarations from these generated package builds.
      - run: pnpm --filter @ascribed/cli build
      - run: pnpm --filter @ascribed/elements build
      - run: pnpm typecheck
      - run: pnpm test

  # The VS Code extension's integration tests run in a real VS Code, against a
  # stub server, and against the real `ascribe lsp` on a copy of examples/quill.
  vscode:
    name: VS Code extension integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p tessera-cli --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/vscode/out/vscode-test
          key: vscode-test-${{ runner.os }}
      # VS Code needs a display; xvfb provides a virtual one.
      - run: xvfb-run -a pnpm --filter ascribe-vscode test:integration
        env:
          ASCRIBE_BIN: ${{ github.workspace }}/target/debug/ascribe

  # The multi-project suite on Windows and macOS, where paths differ from
  # Linux: drive letters, backslashes, and case-insensitive file systems in
  # each project's document selector and ownership. Ubuntu runs it above.
  vscode-platforms:
    name: VS Code multi-project integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p tessera-cli --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/vscode/out/vscode-test
          key: vscode-test-${{ runner.os }}
      - run: pnpm --filter ascribe-vscode test:integration
        env:
          ASCRIBE_SUITE: monorepo
          ASCRIBE_BIN: ${{ github.workspace }}/target/debug/ascribe${{ runner.os == 'Windows' && '.exe' || '' }}

  # Native release binaries are packed into the optional npm packages and
  # installed with scripts disabled before exercising the real Astro site.
  astro:
    name: Astro npm end-to-end (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, env_target: LINUX_X64, exe: ascribe }
          - { os: ubuntu-24.04-arm, target: linux-arm64, env_target: LINUX_ARM64, exe: ascribe }
          - { os: macos-latest, target: darwin-arm64, env_target: DARWIN_ARM64, exe: ascribe }
          - { os: windows-latest, target: win32-x64, env_target: WIN32_X64, exe: ascribe.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p tessera-cli --release --locked
      - run: echo "ASCRIBE_BIN_${{ matrix.env_target }}=$GITHUB_WORKSPACE/target/release/${{ matrix.exe }}" >> "$GITHUB_ENV"
      - run: pnpm --filter @ascribed/cli stage-native ${{ matrix.target }}
      - run: pnpm --filter @ascribed/cli build
      - name: Pack and install npm CLI without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/ascribe-tarballs" "$RUNNER_TEMP/ascribe-install"
          # npm pack preserves the executable mode on the staged native binary.
          npm pack ./packages/cli/platforms/cli-${{ matrix.target }} --pack-destination "$RUNNER_TEMP/ascribe-tarballs"
          # pnpm pack rewrites workspace:* references in the CLI manifest for npm.
          pnpm -C packages/cli pack --pack-destination "$RUNNER_TEMP/ascribe-tarballs"
          npm install --prefix "$RUNNER_TEMP/ascribe-install" --offline --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/ascribe-tarballs/"*.tgz
          "$RUNNER_TEMP/ascribe-install/node_modules/.bin/ascribe" --version
          echo "ASCRIBE_BIN=$(node -p "require.resolve('@ascribed/cli-${{ matrix.target }}/bin/${{ matrix.exe }}', { paths: [process.env.RUNNER_TEMP + '/ascribe-install'] })")" >> "$GITHUB_ENV"
      - run: pnpm --filter @ascribed/elements build
      # The site preview's toolbar app runs review's built package.
      - run: pnpm --filter @ascribed/review build
      - run: pnpm --filter @ascribed/astro build
      - run: pnpm --filter @ascribed/astro test
      - run: pnpm --filter @ascribed/example-astro-site exec playwright-core install --with-deps chromium
        if: runner.os == 'Linux'
      - run: pnpm --filter @ascribed/example-astro-site exec playwright-core install chromium
        if: runner.os != 'Linux'
      - run: pnpm --filter @ascribed/example-astro-site test:e2e
      # The editor preview against the site this job just proved.
      - run: pnpm --filter ascribe-vscode test:parity
        if: matrix.target == 'linux-x64'
