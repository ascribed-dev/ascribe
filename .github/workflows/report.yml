# The daily report on docs/: its external links, and the delivery spec's
# checks on the published site. It's the job docs/content/checks/report.md
# ("On a schedule") gives users, and the page takes it from this file: the
# lines marked `:remove:` are what this repository adds. Links and the
# published site change without a commit, and checking them takes minutes and
# the network, so it runs on a schedule, never on a pull request. When the
# report finds something, or a section can't run, it opens one issue, or
# updates the one that's open, and the run fails. It installs `next`, the
# canary of `main`, over the release, since these docs follow `main`. It
# keeps the answers `report links` reuses, and what it remembers of each
# link, as an artifact of each run, and downloads the newest before the
# report. It uploads right after the report, so a run that finds something
# and fails still keeps it. Not actions/cache: when a repository's caches
# pass 10 GB, GitHub evicts those read longest ago, and this small one, read
# once a day beside the build caches, is first to go. The 21 October run
# found none of the days before (#745).
#
# A second job, after the part the page takes, rereads nothing by itself but
# asks each source of the crawlers Ascribe knows whether it still answers,
# and whether it was read within a year (scripts/crawlers/sources.ts), and
# opens its own issue when one needs rereading.
# :snippet-start: job
name: Report

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    name: links and site report # :remove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LYCHEE: "0.24.2"
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
      AFDOCS: "0.22.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global @ascribed/cli "afdocs@$AFDOCS"
      - run: npm install --global @ascribed/cli@next # :remove:
      - name: Install lychee
        run: |
          name=lychee-x86_64-unknown-linux-gnu
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE/$name.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name/lychee"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Download what the last run kept
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ascribe-links&per_page=20" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == env.GITHUB_REF_NAME)][0].workflow_run.id // empty')
          if [ -n "$run" ]; then
            gh run download "$run" --name ascribe-links --dir docs/.ascribe
          else
            echo "::notice::No earlier run kept what links remembers, so every failure is reported."
          fi
      - name: Report
        id: report
        continue-on-error: true
        run: >
          ascribe report links agents --config docs
          --site https://ascribed-dev.com/docs/ --format markdown --exit-code
          > report.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ascribe-links
          path: |
            docs/.ascribe/cache
            docs/.ascribe/history
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the issue
        if: steps.report.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Docs report: links and the published site"
        run: |
          echo "[The run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> report.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
          exit 1

  # :snippet-end:

  crawler-sources:
    name: crawler sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm version named in package.json's `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Check the sources
        id: sources
        continue-on-error: true
        run: node scripts/crawlers/sources.ts > sources.md
      - run: cat sources.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the issue
        if: steps.sources.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Crawler sources to reread"
        run: |
          echo "[The run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> sources.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file sources.md
          else
            gh issue create --title "$TITLE" --body-file sources.md
          fi
          exit 1
